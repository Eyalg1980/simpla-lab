<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>החוג שלי · הרשמה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles/tokens.css" /><link rel="stylesheet" href="../styles/app.css" />
</head>
<body data-back="class.html" data-title="הרשמה">
<main class="screen">
  <header class="hero-band">
    <h1 class="hello" id="c-title">הרשמה</h1>
    <span class="loc" data-ic="check" id="c-step">שלב 2 מתוך 2 · פרטי הילד ותשלום</span>
  </header>

  <section class="card is-visible reveal">
    <div class="field">
      <label for="kid">שם הילד/ה</label>
      <input id="kid" type="text" value="" />
    </div>
    <div class="field">
      <label for="age">גיל</label>
      <select id="age"></select>
    </div>
    <div class="field">
      <label>מסלול</label>
      <div class="plan">
        <div class="opt selected">פעם בשבוע<br /><strong id="p1"></strong></div>
        <div class="opt">פעמיים בשבוע<br /><strong id="p2"></strong></div>
      </div>
    </div>
  </section>

  <!-- הסיכום נגזר מ-mode שהגיע בכתובת. במסלול הרשמה מלאה שורת שיעור
       הניסיון יורדת והסכום הוא המחיר האמיתי, אחרת המסך היה מבטיח אפס
       להורה שבחר במפורש לשלם. -->
  <section class="card summary-card is-visible reveal">
    <div class="summary-row"><span id="s-label">מנוי חודשי · פעם בשבוע</span><span id="s1"></span></div>
    <div class="summary-row" id="row-trial"><span>שיעור ניסיון</span><span style="color:var(--color-success); font-weight:700;">חינם</span></div>
    <div class="summary-row"><span>דמי רישום</span><span>0 ₪</span></div>
    <div class="summary-row total"><span>לתשלום היום</span><span id="s-total">0 ₪</span></div>
    <p style="margin:8px 0 0; font-size:0.75rem; color:var(--color-muted);" id="s-note"></p>
  </section>

  <a class="btn is-visible reveal" id="c-cta" href="family-board.html">אישור ושריון המקום</a>
  <div class="trust" data-ic="check">תשלום מאובטח · ביטול חופשי · אישור מיידי למייל</div>
</main>

<nav class="bottom-nav" id="nav"></nav>
<script src="../data/classes.js"></script>
<script src="../scripts/ui.js"></script>
<script src="../scripts/kids.js"></script>
<script src="../scripts/nav.js"></script>
<script src="../scripts/appbar.js"></script>
<script src="../scripts/layout.js"></script>
<script>
(function () {
  // המסך נגזר מהחוג ומהילד שהגיעו בכתובת, אחרת לחיצה על בלט
  // הייתה מגיעה למסך שכתוב בו כדורגל
  var q = new URLSearchParams(location.search);
  var cls = window.Kids.classById(q.get('id')) || window.APP_DATA.classes[0];
  var kid = window.Kids.selected[0] || window.APP_DATA.kids[0];
  var trial = q.get('mode') !== 'full';   // ברירת מחדל: שיעור ניסיון
  var $ = function (x) { return document.getElementById(x); };

  document.title = 'החוג שלי · הרשמה ל' + cls.name;
  $('c-title').textContent = (trial ? 'שיעור ניסיון: ' : 'הרשמה: ') + cls.name;
  $('c-step').textContent = trial
    ? 'שלב 2 מתוך 2 · פרטי הילד, בלי תשלום'
    : 'שלב 2 מתוך 2 · פרטי הילד ותשלום';
  $('kid').value = kid.name;
  $('age').innerHTML = '<option>' + kid.age + '</option>';
  $('p1').textContent = cls.price + ' ש"ח';
  $('p2').textContent = Math.round(cls.price * 1.73 / 10) * 10 + ' ש"ח';
  $('s1').textContent = cls.price + ' ש"ח';

  $('s-label').textContent = trial
    ? 'מנוי חודשי · פעם בשבוע · מתחיל אחרי הניסיון'
    : 'מנוי חודשי · פעם בשבוע';
  $('row-trial').hidden = !trial;
  $('s-total').textContent = (trial ? 0 : cls.price) + ' ₪';
  $('s-note').textContent = trial
    ? 'החיוב הראשון רק אחרי שיעור הניסיון, ואפשר לבטל בקליק עד 48 שעות לפניו.'
    : 'החיוב הוא על החודש הראשון. אפשר לבטל עד שבעה ימים מהשיעור הראשון ולקבל החזר מלא.';

  $('c-cta').textContent = trial
    ? 'שריון שיעור הניסיון של ' + kid.name
    : 'אישור ותשלום עבור ' + kid.name;
  $('c-cta').setAttribute('href', window.Kids.link('family-board.html'));
  window.Kids.mount('#nothing');
})();
</script>
</body>
</html>
