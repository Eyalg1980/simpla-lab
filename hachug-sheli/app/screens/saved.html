<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>החוג שלי · שמורים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles/tokens.css" /><link rel="stylesheet" href="../styles/app.css" />
</head>
<body data-back="home.html" data-title="שמורים">
<main class="screen">

  <header class="hero-band">
    <h1 class="hello">מה שמרתם לעצמכם</h1>
    <span class="loc" data-ic="heart">רשימת ההתלבטות, לא רשימת קניות</span>
    <div id="kidpick" style="margin-top:var(--space-2);"></div>
  </header>

  <div class="section-title"><h2 id="s-title">שמורים</h2><span class="saved-when" id="s-count"></span></div>
  <div id="list"></div>

  <!-- למה יש כאן הערה על כל פריט: המחקר הראה שהורים שומרים חוגים
       ואז שוכחים למה. שמורים בלי סיבה הופכים לרשימה מתה. -->
  <section class="card fold is-visible reveal">
    <h2 class="fold-h">למה כל שמור חייב סיבה</h2>
    <div class="fold-b">
      <p style="margin:0; font-size:var(--fs-small); color:var(--color-muted);">
        בראיונות, שלושה מתוך ארבעה ההורים שמרו חוגים בצילום מסך ואז לא זכרו מה הטריד אותם בהם.
        לכן כל שמור כאן נושא שורה אחת של סיבה, ואפשר לערוך אותה. בלי הסיבה, הרשימה חוזרת להיות
        אותה תיקיית צילומי מסך.</p>
    </div>
  </section>
</main>

<nav class="bottom-nav" id="nav"></nav>

<script src="../data/classes.js"></script>
<script src="../scripts/ui.js"></script>
<script src="../scripts/kids.js"></script>
<script src="../scripts/nav.js"></script>
<script src="../scripts/appbar.js"></script>
<script src="../scripts/layout.js"></script>
<script>
(function () {
  var D = window.APP_DATA;
  var $ = function (x) { return document.getElementById(x); };

  function render() {
    var sel = window.Kids.selected.map(function (k) { return k.id; });
    // בלי סימון רואים הכל, כי הורה שלא בחר עדיין מתלבט לכולם
    var rows = D.saved.filter(function (s) {
      return !sel.length || s.for.some(function (id) { return sel.indexOf(id) > -1; });
    });

    $('s-title').textContent = sel.length ? 'שמורים לילדים המסומנים' : 'כל השמורים';
    $('s-count').textContent = rows.length + ' מתוך ' + D.saved.length;

    if (!rows.length) {
      $('list').innerHTML = '<div class="card empty is-visible reveal">' +
        window.UI.icon('heart') +
        '<p style="margin:0 0 4px; font-weight:600; color:var(--color-text);">אין כאן שמורים לילדים שסימנתם</p>' +
        '<p style="margin:0; font-size:var(--fs-small);">בטלו סימון למעלה כדי לראות את כל הרשימה</p></div>';
      return;
    }

    $('list').innerHTML = rows.map(function (s) {
      var c = window.Kids.classById(s.classId);
      var kids = s.for.map(function (id) { return window.Kids.byId(id); }).filter(Boolean);
      return '' +
        '<article class="card saved-card is-visible reveal" data-id="' + c.id + '">' +
          '<div class="chug-icon' + (c.tone === 'warm' ? ' warm' : '') + '">' + window.UI.icon(c.icon) + '</div>' +
          '<div>' +
            '<h3 style="margin:0; font-size:1rem;">' + c.name + '</h3>' +
            '<p class="meta" style="margin:2px 0 0;">ימי ' + c.day + "' " + c.from + ' · ' + c.price + ' ש"ח לחודש</p>' +
            '<div class="saved-note">' + s.note + '</div>' +
            '<div class="saved-for">' +
              kids.map(function (k) { return window.Kids.face(k, 22); }).join('') +
              '<span class="saved-when">נשמר ' + s.addedAgo + '</span>' +
            '</div>' +
          '</div>' +
          '<span class="go">' + window.UI.icon('chevron') + '</span>' +
        '</article>';
    }).join('');

    $('list').querySelectorAll('.saved-card').forEach(function (el) {
      el.addEventListener('click', function () {
        location.href = window.Kids.link('class.html') + '&id=' + el.getAttribute('data-id');
      });
    });
  }

  window.Kids.mount('#kidpick');
  window.Kids.onChange(render);
  render();
})();
</script>
</body>
</html>
