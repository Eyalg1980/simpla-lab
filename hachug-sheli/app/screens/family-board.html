<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>החוג שלי · הלוח המשפחתי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles/tokens.css" /><link rel="stylesheet" href="../styles/app.css" />
</head>
<body data-back="home.html" data-title="הלוח שלנו">
<main class="screen">
  <header class="hero-band">
    <div class="app-header" style="padding-block:0;">
      <div>
        <h1 class="hello">הלוח המשפחתי</h1>
        <span class="loc" data-ic="calendar">השבוע · 2 ילדים · 3 חוגים</span>
      </div>
      <div class="avatar">ד</div>
    </div>
  </header>

  <div class="week is-visible reveal">
    <div class="day">א'</div><div class="day">ב'</div><div class="day today">ג'</div>
    <div class="day">ד'</div><div class="day">ה'</div><div class="day">ו'</div>
  </div>

  <div class="section-title"><h2>היום, יום ג'</h2></div>
  <div id="b-today"></div>

  <div class="section-title"><h2>בהמשך השבוע</h2></div>
  <div id="b-week"></div>

  <section class="card fold is-visible reveal" data-open>
    <h2 class="fold-h">תשלומים</h2>
    <div class="fold-b" id="b-pay"></div>
  </section>

  <section class="card fold is-visible reveal" data-open>
    <h2 class="fold-h">הודעות מהמדריכים</h2>
    <div class="fold-b">
      <p style="margin:0; font-size:var(--fs-small);"><strong>יוסי (כדורגל):</strong> "מחכים לאיתי היום! מגרש 2, ליד השער הצפוני" · לפני שעה</p>
    </div>
  </section>
</main>

<nav class="bottom-nav" id="nav"></nav>
<script src="../data/classes.js"></script>
<script src="../scripts/ui.js"></script>
<script src="../scripts/kids.js"></script>
<script src="../scripts/nav.js"></script>
<script src="../scripts/appbar.js"></script>
<script src="../scripts/layout.js"></script>
<script>
(function () {
  // הלוח נגזר מהדאטה ולא מקודד ב-HTML, כדי שהאייקון, השם והשעה יגיעו
  // מאותו מקור אמת כמו שאר המסכים ולא ידרשו עריכה בשני מקומות
  var $ = function (x) { return document.getElementById(x); };
  var C = window.Kids.classById;
  var K = window.Kids.byId;

  var TODAY = [{ cls: 'football-yossi', kid: 'itai', when: '17:00-18:00 · פארק גבעתיים · להביא בקבוק מים', badge: 'שיעור ניסיון · היום' }];
  var WEEK = [
    { cls: 'ceramics-studio', kid: 'noa', when: "יום ה' 16:30 · רח' כצנלסון" },
    { cls: 'ballet-roni',     kid: 'noa', when: "יום א' 17:15 · סטודיו רוני" }
  ];
  var PAY = [
    { cls: 'football-yossi', kid: 'itai', state: 'paid', text: 'אחרי שיעור ניסיון' },
    { cls: 'ceramics-studio', kid: 'noa', state: 'paid', text: 'שולם · אוגוסט' },
    { cls: 'ballet-roni',     kid: 'noa', state: 'due',  text: 'לתשלום עד 1/8' }
  ];

  function shortName(c) { return c.name.split('·')[0].trim(); }

  function card(row) {
    var c = C(row.cls), k = K(row.kid);
    return '' +
      '<a class="card chug-card is-visible reveal" href="' + window.Kids.link('class.html') + '&id=' + c.id + '">' +
        '<div class="chug-icon' + (c.tone === 'warm' ? ' warm' : '') + '">' + window.UI.icon(c.icon) + '</div>' +
        '<div>' +
          '<h3>' + shortName(c) + ' <span class="kid-tag kid-' + k.colorKey + '">' + k.name + '</span></h3>' +
          '<p class="meta">' + row.when + '</p>' +
          (row.badge ? '<span class="badge trial">' + row.badge + '</span>' : '') +
        '</div>' +
        '<div class="chug-side"><span class="go">' + window.UI.icon('chevron') + '</span></div>' +
      '</a>';
  }

  $('b-today').innerHTML = TODAY.map(card).join('');
  $('b-week').innerHTML = WEEK.map(card).join('');
  $('b-pay').innerHTML = PAY.map(function (row) {
    var c = C(row.cls), k = K(row.kid);
    return '<div class="pay-row"><span class="pay-what">' + window.UI.icon(c.icon) +
      shortName(c) + ' · ' + k.name + '</span>' +
      '<span class="pill-' + row.state + '">' + row.text + '</span></div>';
  }).join('');

  window.Kids.mount('#nothing');
})();
</script>
</body>
</html>
