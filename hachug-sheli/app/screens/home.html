<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>החוג שלי · חיפוש</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles/tokens.css" /><link rel="stylesheet" href="../styles/app.css" />
</head>
<body data-back="" data-title="החוג שלי">
<main class="screen">

  <!-- ההדר צבוע, ובוחר הילדים יושב בתוכו. הצבע מסמן "כאן מתחילים" -->
  <header class="hero-band">
    <div class="app-header" style="padding-block:0 var(--space-2);">
      <div>
        <h1 class="hello">שלום דנה</h1>
        <span class="loc" data-ic="pin">גבעתיים והסביבה</span>
      </div>
      <div class="avatar">ד</div>
    </div>
    <div id="kidpick"></div>
  </header>

  <div class="search is-visible reveal" data-ic="search">מה מחפשים? כדורגל, קרמיקה, רובוטיקה...</div>

  <div class="chips">
    <span class="chip active" id="chip-age">גיל 6-9</span>
    <span class="chip">ספורט</span>
    <span class="chip">יצירה</span>
    <span class="chip">עד 250 ש"ח</span>
    <span class="chip">אחה"צ</span>
  </div>

  <!-- מפה כתצוגה חלופית, לא כדף נפרד. הכאב הוא ודאות, לא גילוי. -->
  <div class="viewtoggle">
    <button type="button" id="v-list" class="on" data-ic="list">רשימה</button>
    <button type="button" id="v-map" data-ic="map">מפה</button>
  </div>

  <div id="mapview" hidden>
    <div class="maparea" id="maparea"></div>
    <p class="maphint">הבית שלכם בשחור. זמן הנסיעה מופיע על כל כרטיס, כי זה מה שמתנגש עם שעת האיסוף.</p>
  </div>

  <div id="listview">
    <div class="section-title"><h2 id="sec-title">מתאים לילדים שלכם</h2><a href="#">הכל</a></div>
    <div id="results"></div>
  </div>
</main>

<nav class="bottom-nav" id="nav"></nav>

<script src="../data/classes.js"></script>
<script src="../scripts/ui.js"></script>
<script src="../scripts/kids.js"></script>
<script src="../scripts/nav.js"></script>
<script src="../scripts/appbar.js"></script>
<script src="../scripts/layout.js"></script>
<script>
(function () {
  var D = window.APP_DATA;
  var $ = function (id) { return document.getElementById(id); };

  // התג נגזר מ-UI.spots, אותו מקור אמת שדף החוג משתמש בו, כדי ששני
  // המסכים לא יגידו דברים מנוגדים על אותו חוג
  function badgeFor(c) {
    var s = window.UI.spots(c);
    return '<span class="badge ' + s.level + '">' + s.short + '</span>';
  }

  // דירוג לפי התאמה לילדים המסומנים. חוג חסום יורד למטה ולא נעלם,
  // כי הורה עדיין רוצה לדעת שהוא קיים.
  function scored() {
    var kids = window.Kids.selected;
    return D.classes.map(function (c) {
      var fits = kids.map(function (k) { return window.Kids.fitFor(k, c); });
      var anyOk = fits.some(function (f) { return f.verdict === 'ok'; });
      var allBlock = fits.length && fits.every(function (f) { return f.verdict === 'block'; });
      return { c: c, fits: fits, rank: anyOk ? 0 : (allBlock ? 2 : 1) };
    }).sort(function (a, b) { return a.rank - b.rank; });
  }

  function render() {
    var kids = window.Kids.selected;
    $('sec-title').textContent = kids.length
      ? 'מתאים ל' + kids.map(function (k) { return k.name + ' (' + k.age + ')'; }).join(' ול')
      : 'כל החוגים באזור';

    // שבב הגיל נגזר מהילדים המסומנים, כדי שהמסננים לא יסתרו את הבחירה
    var chip = $('chip-age');
    if (!kids.length) { chip.textContent = 'כל הגילאים'; chip.classList.remove('active'); }
    else {
      var ages = kids.map(function (k) { return k.age; });
      var lo = Math.min.apply(null, ages), hi = Math.max.apply(null, ages);
      chip.textContent = lo === hi ? 'גיל ' + lo : 'גילאי ' + lo + ' עד ' + hi;
      chip.classList.add('active');
    }

    $('results').innerHTML = scored().map(function (row) {
      var c = row.c;
      var note = '';
      if (row.rank === 2) note = '<p class="meta" style="color:var(--color-danger)">לא בטווח הגילאים או מתנגש בלוח</p>';
      else if (row.rank === 1) note = '<p class="meta" style="color:var(--color-warn)">מתאים לחלק מהילדים</p>';
      return '' +
        '<article class="card chug-card is-visible reveal" data-id="' + c.id + '" ' +
                 'style="' + (row.rank === 2 ? 'opacity:.62' : '') + '">' +
          '<div class="chug-icon' + (c.tone === 'warm' ? ' warm' : '') + '">' + window.UI.icon(c.icon) + '</div>' +
          '<div>' +
            '<h3>' + c.name + '</h3>' +
            '<p class="meta">ימי ' + c.day + "' " + c.from + ' · ' + c.place + ' · ' + c.travelMin + ' דק נסיעה</p>' +
            badgeFor(c) +
            (c.tags.indexOf('שיעור ניסיון חינם') > -1 ? '<span class="badge trial">שיעור ניסיון חינם</span>' : '') +
            note +
          '</div>' +
          // החץ הוא האפורדנס: הכרטיס נראה כמו משהו שנפתח, לא כמו טקסט
          '<div class="chug-side"><div class="price">' + c.price + ' ש"ח<small>/חודש</small></div>' +
            '<span class="go">' + window.UI.icon('chevron') + '</span></div>' +
        '</article>';
    }).join('');

    // כל כרטיס מוביל לדף החוג שלו, לא רק הראשון
    $('results').querySelectorAll('.chug-card').forEach(function (el) {
      el.addEventListener('click', function () {
        location.href = window.Kids.link('class.html') + '&id=' + el.getAttribute('data-id');
      });
    });
    drawMap();
  }

  /* ---- המפה ---- */
  var SPOTS = [{ x: 62, y: 34 }, { x: 30, y: 58 }, { x: 74, y: 70 }, { x: 44, y: 22 }];
  function drawMap() {
    var host = $('maparea');
    var roads =
      '<div class="road" style="right:0; left:0; top:46%; height:10px"></div>' +
      '<div class="road" style="top:0; bottom:0; right:48%; width:10px"></div>';
    var home = '<div class="mappin home" style="right:50%; top:52%">' +
      '<div class="dot">' + window.UI.icon('pin') + '</div><div class="lbl">הבית</div></div>';
    var pins = D.classes.map(function (c, i) {
      var s = SPOTS[i % SPOTS.length];
      return '<a class="mappin" href="' + window.Kids.link('class.html') + '&id=' + c.id + '" ' +
        'style="right:' + s.x + '%; top:' + s.y + '%">' +
        '<div class="dot' + (c.tone === 'warm' ? ' warm' : '') + '">' + window.UI.icon(c.icon) + '</div>' +
        '<div class="lbl">' + c.travelMin + ' דק</div></a>';
    }).join('');
    host.innerHTML = roads + home + pins;
  }

  $('v-list').addEventListener('click', function () {
    this.classList.add('on'); $('v-map').classList.remove('on');
    $('listview').hidden = false; $('mapview').hidden = true;
  });
  $('v-map').addEventListener('click', function () {
    this.classList.add('on'); $('v-list').classList.remove('on');
    $('listview').hidden = true; $('mapview').hidden = false;
  });

  window.Kids.mount('#kidpick');
  window.Kids.onChange(render);
  render();
})();
</script>
</body>
</html>
