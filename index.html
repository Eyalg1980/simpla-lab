<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpla Lab</title>
<style>
  :root{--bg:#F7F5F0;--ink:#1B2A4A;--soft:#5A6784;--coral:#FF6B5E;--line:#E8E4DB}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Heebo","Rubik",-apple-system,sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;padding:28px 18px 48px;line-height:1.6}
  .brand{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--coral)}
  h1{font-size:28px;font-weight:900;margin:4px 0 6px}
  .sub{font-size:14px;color:var(--soft);margin-bottom:24px}
  a.proj{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(27,42,74,.05)}
  a.proj b{font-size:16px;display:block;margin-bottom:2px}
  a.proj p{font-size:13px;color:var(--soft)}
  a.proj .meta{font-size:11.5px;color:var(--coral);font-weight:700}
  .empty{border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--soft);font-size:13.5px}
</style>
</head>
<body>
<div class="brand">SIMPLA LAB</div>
<h1>המעבדה</h1>
<div class="sub">כל הפרויקטים החיים שנבנו עם Claude, במקום אחד</div>

  <p>בריף בוקר יומי: רעיונות לפוסטים, גישות כתיבה ומאגרי השראה</p>
  <span class="meta">30.7.2026</span>
</a>

<a class="proj" href="https://eyalg1980.github.io/simpla-lab/daily-director/">
  <b>🎬 Daily Director · הבמאי היומי</b>
  <p>רעיונות יומיים לסרטונים, מעקב תחרויות וידאו AI, והשראה קולנועית</p>
  <span class="meta">31.7.2026</span>
</a>

<div class="empty">פרויקטים חדשים יתווספו לכאן אוטומטית</div>
</body>
</html>
