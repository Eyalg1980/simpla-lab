<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1420">
<title>Daily Director · הבמאי היומי</title>
<style>
  :root{
    --bg:#0E1420; --card:#1A2332; --card2:#141C2B; --ink:#F2EFE7; --soft:#8B96AC;
    --coral:#FF6B5E; --teal:#2BB3A3; --gold:#FFC940; --purple:#9B8CFF;
    --line:#273248; --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:"Heebo","Rubik",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);
    padding:14px 16px 60px; max-width:520px;margin:0 auto; line-height:1.55;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .brand{font-size:14px;font-weight:900;letter-spacing:.05em;color:var(--gold)}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--soft);letter-spacing:0}
  .gen-btn{
    border:none;cursor:pointer;font-family:inherit;
    background:var(--coral);color:#fff;font-size:12.5px;font-weight:700;
    padding:9px 15px;border-radius:999px;box-shadow:0 2px 10px rgba(255,107,94,.35);
  }
  .gen-btn:active{transform:scale(.97)}
  nav{
    position:sticky;top:8px;z-index:20;display:flex;gap:6px;
    background:#151E2E;border-radius:999px;padding:4px;margin-bottom:16px;
    border:1px solid var(--line);
  }
  nav button{
    flex:1;border:none;cursor:pointer;font-family:inherit;
    background:transparent;color:var(--soft);font-size:13px;font-weight:700;
    padding:9px 4px;border-radius:999px;transition:all .15s;
  }
  nav button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.4)}
  .tab{display:none}
  .tab.active{display:block}

  .date-chip{position:sticky;top:56px;z-index:5;text-align:center;margin:18px 0 14px}
  .date-chip span{display:inline-block;background:#232E45;color:#AEB9CF;font-size:12px;font-weight:700;padding:6px 16px;border-radius:999px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 14px;margin-bottom:14px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;right:0;bottom:0;width:4px;background:var(--accent,var(--coral))}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb, var(--accent,var(--coral)) 18%, var(--card));color:var(--accent,var(--coral));border:1px dashed color-mix(in srgb, var(--accent,var(--coral)) 50%, var(--card))}
  .tag.comp{background:#2B2410;color:var(--gold);border-color:#4A3D14}
  .hook{font-size:18px;font-weight:800;line-height:1.42;margin-bottom:10px}
  .label{font-size:11px;font-weight:700;color:var(--soft);letter-spacing:.06em;margin-bottom:2px}
  .angle{font-size:14.5px;color:#C9D2E3;margin-bottom:10px}
  .why{font-size:13.5px;color:#C9D2E3;background:var(--card2);border-radius:12px;padding:9px 12px;margin-bottom:12px}
  .why b{color:var(--ink)}
  .card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:11px;margin-top:2px}
  .src{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;text-decoration:none;color:var(--ink);background:#20304A;border:1px solid #2C3E5E;padding:7px 12px;border-radius:999px}
  .expand-btn{border:none;cursor:pointer;font-family:inherit;margin-inline-start:auto;background:var(--accent,var(--coral));color:#fff;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:999px}
  .expand-btn:active{transform:scale(.97)}
  h2{font-size:14px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px;color:var(--soft)}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .art{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:9px}
  .art b{font-size:14px;display:block;margin-bottom:2px;line-height:1.4}
  .art p{font-size:12.5px;color:var(--soft)}
  .art .meta{font-size:11px;color:var(--gold);font-weight:700;margin-top:5px;display:block}

  /* Competitions */
  .comp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-bottom:14px;position:relative;overflow:hidden}
  .comp-card::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--coral))}
  .comp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
  .comp-name{font-size:17px;font-weight:900}
  .comp-org{font-size:12px;color:var(--soft);margin-bottom:10px}
  .deadline{font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px;background:#3A1512;color:#FF9C93;white-space:nowrap}
  .deadline.watch{background:#1D2A3F;color:#8FB2E8}
  .comp-row{display:flex;gap:8px;font-size:13.5px;color:#C9D2E3;margin-bottom:6px}
  .comp-row b{color:var(--ink);min-width:52px}
  .comp-notes{font-size:13px;color:#C9D2E3;background:var(--card2);border-radius:12px;padding:9px 12px;margin:10px 0}
  .comp-ideas{border-top:1px dashed var(--line);padding-top:10px;margin-top:8px}
  .comp-idea{background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .comp-idea b{font-size:13.5px;display:block}
  .comp-idea p{font-size:12.5px;color:var(--soft);margin-top:2px}
  .comp-actions{display:flex;gap:8px;margin-top:10px}
  .comp-link{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:800;padding:10px;border-radius:12px;background:#20304A;color:var(--ink);border:1px solid #2C3E5E}
  .comp-gen{flex:1;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:800;padding:10px;border-radius:12px;background:var(--gold);color:#1A1405}
  .comp-gen:active{transform:scale(.98)}

  .lk-cat{margin-bottom:20px}
  .lk{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;position:relative}
  .lk b{font-size:13.5px;display:block;line-height:1.4}
  .lk p{font-size:12px;color:var(--soft);margin-top:1px}
  .lk .lk-tag{position:absolute;top:10px;left:12px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:#20304A;color:#8FB2E8}

  #toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%) translateY(80px);background:var(--gold);color:#1A1405;font-size:13px;font-weight:700;padding:11px 18px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.5);transition:transform .25s ease;z-index:60;max-width:92%;text-align:center}
  #toast.show{transform:translateX(50%) translateY(0)}
  footer{margin-top:26px;text-align:center;font-size:11.5px;color:var(--soft);border-top:1px dashed var(--line);padding-top:12px}
  footer a{color:var(--soft)}
  .loading{text-align:center;color:var(--soft);padding:40px 0;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="brand">🎬 DAILY DIRECTOR<small>הבמאי היומי של אייל</small></div>
  <button class="gen-btn" onclick="copyCmd('צור עוד 3 רעיונות לסרטונים לבמאי היומי, בנוסף לאלה שכבר יש, ועדכן את הדף')">⚡ עוד רעיונות</button>
</header>

<nav>
  <button class="active" data-tab="ideas" onclick="showTab('ideas')">🎬 רעיונות</button>
  <button data-tab="comps" onclick="showTab('comps')">🏆 תחרויות</button>
  <button data-tab="insp" onclick="showTab('insp')">🎞️ השראה</button>
</nav>

<div id="ideas" class="tab active"><div class="loading">טוען רעיונות...</div></div>
<div id="comps" class="tab"><div class="loading">טוען תחרויות...</div></div>
<div id="insp" class="tab"><div class="loading">טוען השראה...</div></div>

<footer>
  לחיצה על כפתור מעתיקה פקודה מוכנה לקלוד · <a href="../">חזרה למעבדה</a>
</footer>
<div id="toast">הועתק, הדבק בקלוד 🎬</div>

<script>
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function copyCmd(cmd){
  const done=()=>{const t=document.getElementById('toast');t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(cmd).then(done).catch(()=>fallback(cmd,done))}
  else fallback(cmd,done);
}
function fallback(cmd,done){
  const ta=document.createElement('textarea');ta.value=cmd;document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy');done()}catch(e){prompt('העתק ידנית:',cmd)}
  document.body.removeChild(ta);
}
function showTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id===id));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
  window.scrollTo({top:0});
}

function renderIdeas(data){
  const el=document.getElementById('ideas');
  let html='';
  const days=[...data.days].sort((a,b)=>b.date.localeCompare(a.date));
  for(const day of days){
    html+='<section><div class="date-chip"><span>'+esc(day.dateLabel)+'</span></div>';
    for(const idea of (day.ideas||[])){
      const cmd='פתח את רעיון הווידאו הזה לברייקדאון מלא: תסריט, שוט-ליסט ופרומפטים להיגספילד. הרעיון (הבמאי היומי '+day.dateLabel+'): "'+idea.hook+'"';
      html+='<article class="card" style="--accent:'+esc(idea.color||'#FF6B5E')+'">';
      html+='<div class="tags"><span class="tag">'+esc(idea.world)+'</span>';
      if(idea.competition)html+='<span class="tag comp">🏆 '+esc(idea.competition)+'</span>';
      html+='</div><div class="hook">'+esc(idea.hook)+'</div>';
      html+='<div class="label">הקונספט</div><div class="angle">'+esc(idea.concept)+'</div>';
      html+='<div class="label">איך מבצעים</div><div class="angle">'+esc(idea.execution)+'</div>';
      html+='<div class="why"><b>למה עכשיו:</b> '+esc(idea.why)+'</div>';
      html+='<div class="card-actions">';
      if(idea.srcUrl)html+='<a class="src" href="'+esc(idea.srcUrl)+'" target="_blank" rel="noopener">🔗 '+esc(idea.srcLabel||'מקור')+'</a>';
      html+='<button class="expand-btn" data-cmd="'+esc(cmd)+'">🎬 פתח לתסריט</button>';
      html+='</div></article>';
    }
    if(day.watch&&day.watch.length){
      html+='<h2>שווה צפייה</h2>';
      for(const a of day.watch){
        html+='<a class="art" href="'+esc(a.url)+'" target="_blank" rel="noopener"><b>'+esc(a.title)+'</b><p>'+esc(a.desc)+'</p><span class="meta">'+esc(a.meta)+'</span></a>';
      }
    }
    html+='</section>';
  }
  el.innerHTML=html;
  el.querySelectorAll('.expand-btn').forEach(b=>b.addEventListener('click',()=>copyCmd(b.dataset.cmd)));
}

function renderComps(data){
  const el=document.getElementById('comps');
  let html='<p style="font-size:12.5px;color:var(--soft);margin-bottom:14px">עודכן: '+esc(data.updated)+' · המערכת סורקת תחרויות חדשות בכל בוקר</p>';
  for(const c of data.competitions){
    const watch=c.status!=='פתוח';
    html+='<div class="comp-card">';
    html+='<div class="comp-head"><span class="comp-name">'+esc(c.name)+'</span><span class="deadline'+(watch?' watch':'')+'">⏳ '+esc(c.deadline)+'</span></div>';
    html+='<div class="comp-org">'+esc(c.org)+'</div>';
    html+='<div class="comp-row"><b>נושא</b><span>'+esc(c.theme)+'</span></div>';
    html+='<div class="comp-row"><b>פרס</b><span>'+esc(c.prize)+'</span></div>';
    if(c.notes)html+='<div class="comp-notes">'+esc(c.notes)+'</div>';
    if(c.ideas&&c.ideas.length){
      html+='<div class="comp-ideas"><div class="label" style="margin-bottom:6px">💡 רעיונות לתחרות הזאת</div>';
      for(const i of c.ideas){
        html+='<div class="comp-idea"><b>'+esc(i.hook)+'</b><p>'+esc(i.concept)+'</p></div>';
      }
      html+='</div>';
    }
    const cmd='ברינסטורם לתחרות '+c.name+' ('+c.theme+', דדליין '+c.deadline+'): צור עוד 3 קונספטים בשבילי ועדכן את דף התחרויות';
    html+='<div class="comp-actions"><a class="comp-link" href="'+esc(c.url)+'" target="_blank" rel="noopener">🔗 לאתר התחרות</a>';
    html+='<button class="comp-gen" data-cmd="'+esc(cmd)+'">💡 עוד רעיונות</button></div>';
    html+='</div>';
  }
  el.innerHTML=html;
  el.querySelectorAll('.comp-gen').forEach(b=>b.addEventListener('click',()=>copyCmd(b.dataset.cmd)));
}

function renderInsp(data){
  const el=document.getElementById('insp');
  let html='<p style="font-size:12.5px;color:var(--soft);margin-bottom:14px">סרטונים, פורמטים ומקורות שמזינים את הבמאי. שלח לקלוד סרטונים שאהבת והם ייכנסו לכאן מנותחים.</p>';
  for(const cat of data.categories){
    html+='<div class="lk-cat"><h2>'+cat.emoji+' '+esc(cat.name)+'</h2>';
    for(const l of cat.links){
      html+='<a class="lk" href="'+esc(l.url)+'" target="_blank" rel="noopener"><span class="lk-tag">'+esc(l.tag)+'</span><b>'+esc(l.title)+'</b><p>'+esc(l.desc)+'</p></a>';
    }
    html+='</div>';
  }
  el.innerHTML=html;
}

const v='?v='+Date.now();
fetch('videos.json'+v).then(r=>r.json()).then(renderIdeas).catch(()=>{document.getElementById('ideas').textContent='לא הצלחתי לטעון'});
fetch('competitions.json'+v).then(r=>r.json()).then(renderComps).catch(()=>{document.getElementById('comps').textContent='לא הצלחתי לטעון'});
fetch('inspiration.json'+v).then(r=>r.json()).then(renderInsp).catch(()=>{document.getElementById('insp').textContent='לא הצלחתי לטעון'});
</script>
</body>
</html>
