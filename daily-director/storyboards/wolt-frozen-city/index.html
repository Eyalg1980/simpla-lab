    en: `A street in a small city made entirely of clay. It has stopped. Not destroyed, not abandoned, simply paused mid step. The colour has not vanished from the city, it has drained out of it, leaving everything a pale chalky cream.

In the middle of the street two people sit at a small table. He is mid sentence, one hand raised. She is mid laugh. Between them is a single empty plate. They froze along with everything else.

Twenty one seconds in which nothing moves at all. A dog caught mid leap. A cyclist with one foot in the air. Steam that has hardened into a solid sculpted curl of clay. Then a close up on the empty plate, and four hands around it that only tremble.

A courier enters at the far end of the street on a teal scooter. He is the only fully saturated element in the film, and the only one carrying motion blur.

As he passes a cafe, a warm boundary is born under his rear wheel. Coral and yellow press into the cold clay along a hard physical edge. The boundary starts to run, outpaces the wheel, and figure after figure returns to motion the instant it reaches them.

Cut to them. The boundary has reached the legs of the table and is climbing through the material. Their shoes are already warm, their faces still pale.

The bag opens and the light spills. The plate lands full, four hands reach into it, and the clay turns from cream to coral. Then the faces: his sentence finally lands, and she genuinely laughs.

Back to the opening frame, from the exact same angle. The whole city is moving and the scooter is already small at the edge of frame, leaving. The thesis: the product is not the scooter. The product is the moment the conversation continues.`

    en: `Warm, handmade, patient. This is not an energetic commercial and not technology hype. The feeling left at the end should be small relief, not excitement. The film must read with the sound off, because a jury watching hundreds of spots will mute the first one.
