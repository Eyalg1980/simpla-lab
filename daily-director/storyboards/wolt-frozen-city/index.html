  notes: {
    title: "מה עושים עם הפריימים האלה",
    items: [
      "סבב v7 10.8, הפסקול: הטרק Thunder in the Wind (שאייל ייצר) נכנס ב-19 שנ' עם מעטפת volume דינמית ב-ffmpeg (eval=frame): נכנס ב-0.10 ומטפס ל-0.26, מונמך ל-0.22-0.26 תחת כל שורת קריינות ותחת השיחה בבית, בונה ל-0.62 עד הדלת, 0.34 תחת הנקישות, שיא 0.80 בצלחת המלאה, 0.78 בעיר החיה, ודהייה מ-0.34 לאפס בסוף. הרוח סונתזה ב-sox במקום טייק Kling (brownnoise 190-280Hz + שני tremolo לגאסטים) - נקייה ובלי קליפינג. נוסף רעש מנוע קטנוע על שוט הכניסה. השיחה בבית והצחקוק גונרטו מחדש כטייקי Kling נקיים: מרמור חם בלי מילים מזוהות במקום הטקסט הקטוע, וצחקוק אחד של 1.35 שנ' בלבד. שוט הסמטאות עבר לדולי דיגיטלי כמו שוט העיר - אחרי חמישה ניסיונות שבהם קלינג הזיז את הפסלים. סך הכל 56.4 שניות. הטרק שמור בריפו: music-thunder-in-the-wind.mp3.",
      "סבב v6 8.8: חלק א' - פתיח קוצר ל-2.5 שנ' בלי סאונד אפקט, העיר 4 שנ', הכלב 2.5, הבית 4.5, רוח קרה (טייק Kling בלולאה) על כל החלק, ונוספה שורת קריינות: It feels like someone switched the whole city off... and it froze (5.1 שנ', פיקסי). חלק ב' - הגלגל הראשון הואץ x1.2, הצומת x1.25, הדלת x1.3, הצלחת המלאה 3 שנ', הבית 3.5, הזוג 3.5 עם צחקוקים מונמכים (0.45/0.4), הנקישות סונכרנו לתחילת שוט הדפיקה, והסגיר גונרט מחדש: מצלמה נעולה בלי זום והשליח חולף מהר מול הלוגו. סך הכל 56.4 שניות - כמעט בדיוק 55 של התקנון. מוזיקה: אין מודל מוזיקה זמין בהיגספילד (sonilo_music נעול לפייפליין משחקים) ואין קונקטור Suno/Udio ברגיסטרי - שתי אופציות: טרק מוכן מ-Suno שמצרפים למיקס, או קונקטור קסטום.",
      "סבב v5 6.8: שורת הקריינות השנייה (Not because of a disaster. Because of hunger.) הוסרה מהמיקס לגמרי - הצלחת הריקה עובדת בשקט. שוט העיר הקפואה: אחרי ארבעה ניסיונות שבהם קלינג הזיז דמויות, ההנפשה הוחלפה בזום דיגיטלי איטי (ffmpeg zoompan 1.00-1.08) על פריים הסטילס - קיפאון מובטח. זה גם הפתרון המומלץ לכל שוט קפאון עתידי שקלינג מסרב להשאיר סטטי.",
      "סבב v4 6.8: הפתיח נשאר טקסט בלבד עם סאונד אפקט עדין (וווש+צ'יים מטייק Kling) ובלי קריינות. העיר הקפואה הונפשה מחדש - אף דמות לא זזה, רק דריפט מצלמה עדין. שוט הטיול הוחלף ב-walk-through בסמטה צרה של עיר עתיקה צפופה (קשתות, כביסה, דוכנים, חתול קפוא). נוסף שוט 4 חדש: קלוז אפ על פני כלב חימר קפוא וחסר צבע. שוט השליח בדלת הונפש מחדש - הצבע מחלחל רק בתחתית הדלת, סנטימטרים ספורים. נוסף סאונד נקישות (טייק Kling על פריים הדפיקה) ב-45-48. סך הכל 67 שניות, 16 שוטים. קבצי סאונד חדשים: hf_20260806_075801_12f611d0 (פתיח), hf_20260806_075802_e2c0f5af (נקישות).",
      "סבב מסגרת 6.8: נוספו שלושה שוטים. פתיח (שוט 1): כרטיס טקסט מפוסל בחימר In a frozen city... עם קריינות פיקסי (1.4 שנ'). טיול ברחובות (שוט 3): דולי קדימה בגובה רחוב בין הפסלים הקפואים, יוצר מפריים העיר כרפרנס. סגיר (שוט 15): לוגו וולט מפוסל בחימר על לוחית כחולה עם הסלוגן So that someone moves for you. מתחתיו, על רקע חם עם אדי קיטור, וקריינות הסיום עברה אליו (60.5). האיות בשני כרטיסי הטקסט נבדק ויצא נקי בג'ינרוט. סך הכל 64 שניות, 15 שוטים.",
      "סבב סאונד 6.8: הקריינות הוחלפה לאנגלית בקול ילדה רך ושקט (Pixie על ElevenLabs, נמדדה: 2.9 / 3.2 / 2.2 / 4.0 / 3.3 שנ'). נוצרו שכבות סאונד מטייקים של Kling עם sound on, ורק האודיו שלהם הונח מתחת לוויזואל המאושר: שריקת השליח (18-22), צהלות קהל בצומת (22-30), צחקוקים בבית (41-45) ובקלוז אפ (45-49). שוט 1 הונפש מחדש שוב - עיר קפואה לגמרי, רק המצלמה זזה. קבצי קריינות: hf_20260806_040719_9753a54e, 310d3c4b, 0851cef0, e421d9c3, 78808008. טייקי סאונד: hf_20260806_040705_bd39115a (שריקה), hf_20260806_040732_0a72d562 (קהל), hf_20260806_040705_61c8d00b (בית), hf_20260806_040705_e2c939cb (קלוז אפ).",
      "סבב 5.8 לילה: שוט 10 יוצר מחדש עשיר ואנושי יותר (ספה קורל, כריות טורקיז, ספרים צבעוניים, מנורה דולקת, אור זהוב בחלון, אוכל מפורט, קצה קרם אחרון נמס בפינת הקיר), ונוסף שוט 11 חדש: קלוז אפ על הזוג כשהצבע מסיים להתמלא בדמויות והם מצחקקים, האישה מלאה תנועה וחן. העיר החיה עברה לשוט 12. משך כולל 52 שניות. פריים שוט 11 הוא מועמד טבעי לקאבר של פוסט הלינקדאין.",
      "סבב 5.8 ערב, נעילת הקונספט: לבן = קפוא לחלוטין (אף דמות לבנה לא זזה), צבע = חי ובתנועה, והשליח של וולט הוא מקור הצבע. השולחן של הזוג עבר מהרחוב אל תוך הבית. ירדו שוט הזוג הצבעוני ברחוב ושוט האורביט על התיק (Veo); נכנסו: קלוז אפ שליח שורק, צומת שנצבעת (8 שנ' עם קשת מצלמה), שליח בדלת, יד דופקת בדלת, והבית שנצבע. כל 11 הקליפים עכשיו Kling 3 std, בלי Veo. משך כולל 48 שניות.",
      "קונסיסטנטיות דמויות: הזוג בפנים מיוצר מפריים הבית (hf_20260805_155417_f94aa50f, שוטים 2 ו-10), שנבנה בעצמו מפריים האב הישן של הזוג. השליח מיוצר מפריים 4 (hf_20260805_114925_993f5b44, משמש רפרנס לשוטים 5, 6, 7, 8). כל ריג'ן חייב לצרף את אותם רפרנסים.",
      "הלוגו של וולט חי פיזית על הקופסה בשוטים 4, 6 ו-7, מפוסל בחימר על בסיס תמונת התיק האמיתי (ref-wolt-bag.png). לבדוק אותיות בכל רינדור; אם התעוותו, מרכיבים את הלוגו בעריכה.",
      "קריינות מוקלטת ומדודה (גדעון, ElevenLabs): 2.9 / 2.6 / 1.6 / 4.2 / 3.7 שניות. מפת הטיימינג עודכנה ל-48 שניות והשורות נכנסות בחלונות. קבצים: hf_20260805_115233_93ec1c3d, b70cd39e, 2731d406, 277d5796, fafbacce.",
      "התקנון דורש לפחות 51 אחוז ויזואל AI; כאן זה מאה אחוז, להצהיר בטופס.",
