    enCopyLabel: "Copy English direction",
    en: "Tone: the film believes itself completely, from the first second to the logo. It is not a parody that announces itself, it is a real commercial that happens to be selling an impossible thing. All of the comedy comes from the gap between the seriousness of the form and what is happening inside it, which is precisely the mechanism behind the largest prize ever awarded to an AI short. The moment the film winks, the format stops licensing the flaws and starts exposing them.\n\nTwo visual languages: product studio against domestic material, and the switch between them is hard and never softened. The studio is smooth black, a clean rim, extremely shallow depth of field and zero grain. The domestic is available light, real grain, and a camera resting in a hand. Shot 16 leaves the language of the commercial entirely, which is exactly why it works.\n\nPacing: it builds steadily from the reveal through the montage in shot 15, then falls away completely. Shot 16 is twice the length of any other shot in the film and must never be cut into.\n\nCamera: all twenty one shots are locked. There is no camera movement in this film at all, because a real product commercial does this on a slider or with a cut rather than with a wobble, and because a locked shot is a shot that cannot fall apart.\n\nCats: the cat is the film's non-human protagonist and it never acts. It is unimpressed in shot 8, unresponsive in shot 14, and not looking in shot 18. The directing instruction is that the cat always does less than the moment asks for.\n\nSound: clean product-launch music throughout, rising toward the montage. It stops completely on the cut into shot 16 and returns only at the logo. Shot 16 is the only shot with no music, and that is what makes it a moment rather than another scene.\n\nText: exactly two cards, both added in the edit and neither generated: the logo and tagline in shot 19, and the small print in shot 20. The small print is the best joke in the film, which is why it has to look exactly like real small print, small and boring and not emphasised."
  },

  story: {
    h3: "מאיפה זה מגיע",
    copyLabel: "העתק סיפור רקע",
    copyHead: 'סיפור הרקע לסרט "עברית לחתולים":',
    paras: [
      "הרעיון שאפשר לתרגם חיה הוא ישן וחוזר בכל פעם שיש טכנולוגיה חדשה להתלות בה. מה שהשתנה בשנים האחרונות הוא שזה הפסיק להיות בדיחה: יש היום מאמצים רציניים ומתועדים לפענח תקשורת של חיות בעזרת מודלים, ובעולם הצרכני יש כבר מוצרים שמבטיחים לתרגם נביחות או ניאוקים לשפה אנושית. הרעיון הבדיוני היחיד בסרט הזה הוא הרמה שבה זה עובד, לא הקיום שלו.",
      "וזאת בדיוק הסיבה שהוא עובד כפרסומת מזויפת. הצופה כבר ראה השקה כזאת. הוא מכיר את הדקדוק לגמרי: השחור בהתחלה, החומר שמסתובב באיטיות, פיצוץ הרכיבים באוויר, המספר הגדול שאמור להרשים, והעדות שמצולמת באור רך על כיסא. אנחנו לא צריכים להסביר שום דבר מהצורה הזאת, כי היא כבר יושבת בראש שלו.",
      "ומכאן הבחירה שהופכת את זה מבדיחה לסרט. השאלה שהמכשיר מבטיח לענות עליה היא מה החתול חושב. השאלה האמיתית של האדם שקונה אותו היא שונה לגמרי, והיא האם החתול אוהב אותי. אלה לא אותה שאלה, והמכשיר יכול לענות רק על הראשונה. כל הסרט בנוי על הפער הזה.",
      "בעלים של חתולים כבר יודעים את התשובה. הם לא צריכים מכשיר כדי לדעת שהחתולה שלהם אדישה, הם חיים עם זה כל יום, והם נשארים בכל מקרה. וזה בדיוק מה שקורה בשוט 16: הגבר מקבל אישור מפורש למה שהוא כבר ידע, וזה לא משנה שום דבר בהתנהגות שלו. הוא נשאר על הרצפה.",
      "מה שנשאר פתוח, ואני לא בטוח שיש לזה תשובה טובה: אם היינו יכולים באמת לשמוע מה כל דבר שאנחנו אוהבים חושב עלינו, האם היינו רוצים. עדות ב בשוט 13 אומרת את זה בשש מילים, והסרט לא חוזר על זה אף פעם. הוא רק מוכר לך את המכשיר."
    ],
    enLabel: "English backstory",
    enCopyLabel: "Copy English backstory",
    en: "The idea that an animal could be translated is old, and it comes back every time there is a new technology to hang it on. What changed in recent years is that it stopped being a joke: there are now serious documented efforts to decode animal communication using models, and in the consumer world there are already products promising to turn barks or meows into human language. The only invented thing in this film is the level at which it works, not the fact that it exists.\n\nAnd that is exactly why it works as a fake commercial. The viewer has already seen this launch. They know the grammar completely: the black at the start, the material turning slowly, the components exploding in mid air, the big number meant to impress, and the testimonial shot in soft light on a chair. We do not need to explain any of that form, because it is already sitting in their head.\n\nFrom there comes the choice that turns this from a joke into a film. The question the device promises to answer is what does the cat think. The real question of the person buying it is a completely different one, and it is does the cat love me. Those are not the same question, and the device can only answer the first. The whole film is built on that gap.\n\nCat owners already know the answer. They do not need a device to tell them their cat is indifferent, they live with it every day, and they stay anyway. And that is exactly what happens in shot 16: the man gets explicit confirmation of what he already knew, and it changes nothing at all in his behaviour. He stays on the floor.\n\nWhat stays open, and I am not sure it has a good answer: if we really could hear what everything we love thinks about us, would we want to. The second testimonial says it in six words in shot 13, and the film never returns to it. It just goes on selling you the device."
  },

    title: "איך מפיקים את זה, ומה מסוכן בו",
    items: [
      "אופי התנועה במשפט אחד: שתי שפות תנועה שמסרבות להכיר אחת בשנייה. שפת מוצר מלוטשת, איטית, סחרורית, בסלואו מושן ובתאורת רים, מול שפת חתול שהיא בדיוק ההפוך: לא משתף פעולה, לא מסתכל למצלמה, ולא עושה שום דבר שהמצגת אומרת שהוא עושה. הבדיחה בפער, ולכן שתי השפות לא מתערבבות אף פעם באותו שוט.",
      "דקדוק העריכה, נקבע 11.8. סופר קלוז אפים: שלושה בדיוק ולא רביעי, האישון בשוט 3, המיקרופונים, והקולר שנדלק בלילה. השלישי הוא היחיד שלא מצחיק וזה בדיוק העניין. בורסט: אחד, שוט 15, מונטאז' הפיצ'רים אחרי ההדגמה, שלושה או ארבעה חתכים של שנייה עד שנייה וחצי. אותה טכניקה שיוצרת מתח, כאן בשירות הקומדיה. סלואו מושן: חשיפת החתול בפתיחה, וברירה נוספת בקולר שנופל על הרצפה בשוט האחרון.",
      "שוט 16 הוא היחיד בסרט שבו שפת המוצר נעלמת לגמרי. אין רים, אין גרדיאנט, אין סחרור, אין מוזיקה, ואין תנועת מצלמה. אם תשים שם מוזיקה, זה יהפוך לסצנה עצובה בפרסומת. בלי כלום, זה פתאום הסרט האמיתי, וכל מה שלפניו נעשה הכנה.",
      "החתול לא משתף פעולה בשום שוט. אם קליפ חוזר עם חתול שמסתכל למצלמה בעניין או מגיב למכשיר, הוא פסול גם אם הוא חמוד, כי אי שיתוף הפעולה הוא כל הבדיחה.",
      "השער של הסרט הזה: שוט 16, רצפת המטבח בלילה. לרנדר אותו לבד לפני שמפיקים שוט אחר. אם הוא לא נוגע, הסרט הוא סתם פרסומת מצחיקה ולא שווה את ההגשה.",
      "אריתמטיקת הבורסט, כלל לכל הסרטים: קלינג לא נותן קליפ קצר משלוש שניות, אז חתך של שנייה ורבע הוא לא ג'נרציה קצרה אלא קליפ של שלוש שניות שנחתך בעריכה. בורסט של חמישה חתכים עולה חמש עשרה שניות של ג'נרציה בשביל שש שניות של סרט. זה בזבוז מכוון ושווה אותו, כי זה הכלי היחיד שיוצר מתח פיזי בצופה.",
      "סלואו מושן מבקשים מקלינג בפרומפט ולא מותחים ב-setpts בעריכה. מתיחה בלי אינטרפולציית פריימים נראית רע מעל בערך פי אחד וחצי, וזה הבאג שאכל ארבעה סרטים בסדרה. הנוסח שעובד פותח ב-high speed camera slow motion ומתאר את התנועה כאילו היא נמשכת ארבע פעמים יותר זמן. בונוס: במהירות כזאת שגיאות פיזיקה ומומנטום מפסיקות להיקרא, וזה בדיוק מה שעשה הסרט שלקח מאה וחמישים אלף דולר.",
      "מעטפת הסאונד, אותה צורה בכל שלושת הסרטים ובכוונה: סאונד יומיומי ורציף עולה בהדרגה לאורך שני שלישים, נהיה צפוף ומעיק בבורסט, ואז נופל לאפס רגע לפני התשלום, והתשלום עצמו נשמע בשקט. שקט מוחלט הוא האפקט החזק ביותר שיש, והוא עובד רק אם משהו נבנה לפניו.",
      "סדר ההנפשה, לא לפי סדר השוטים אלא לפי סיכון: קודם שער אחד לסרט שאם הוא נופל הסרט לא רץ, ואחריו שלושה או ארבעה עוגנים שמאפשרים רוף קאט, ואחריהם כל הקלוז אפים והאובייקטים שהם הבטוחים והזולים, ובסוף הבורסטים והסלואו מושן, כי צריך לדעת את האורך המדויק שלהם בקאט לפני שמייצרים אותם.",
      "תיקון אורך, וזו הפעם השלישית ברצף: הטיפול כתב 2:40, מה שהיה פוסל את הסרט אוטומטית באסטנה ומוציא אותו מהרף של היגספילד. סכום המשכים בטבלה הוא 228 שניות, כלומר 3:48, והסרט כשר לשתי התחרויות בלי לשנות בו שוט אחד. תמיד לסכם את הטבלה.",
      "הסיכון היחיד שיכול להרוג את הסרט הוא קריצה. אף שוט לא מודה שזו בדיחה, אף שחקן לא מרים גבה, והקריינות לא משנה טון אפילו בשורה על ארבע מאות אלף שעות. השורה הכי מצחיקה בסרט, האותיות הקטנות בשוט 20, נמסרת בלי שום הדגשה.",
      "נעילת דמות: שני גיליונות דמות בארבע תצוגות, אחד לחתול ואחד לגבר של שוט 16, וכל שוט שבו הם מופיעים יוצר מהגיליון כרפרנס תמונה פלוס מחרוזת נעילה זהה מילה במילה. חתול הוא מקרה קשה יותר מאדם כי הסימנים שלו קטנים, ולכן מחרוזת הנעילה כאן נוקבת בשלושה סימנים ולא בשניים: כתם החזה הלבן, כף רגל קדמית לבנה אחת, וחריץ קרוע באוזן השמאלית.",
      "כל עשרים ואחד הפריימים כבר יוצרו ב-Nano Banana Pro ב-16:9 ומחוברים לכרטיסים כאן. מה שנשאר הוא הנפשה, קריינות, מוזיקה ועריכה.",
      "מחרוזת סגנון אחת לא מספיקה לסרט הזה, ולכן יש כאן ארבע, וכל כרטיס נושא את שלו בשדה `style`. סטודיו מוצר, ביתי מלוטש, ביתי אמיתי, ועדות. זה בכוונה נגד הכלל הרגיל של מחרוזת אחת לסרט, כי בסרט הזה חילוף השפה החזותית הוא התוכן.",
      "אין מודל מוזיקה בהיגספילד. הפסקול של השקת מוצר צריך להיות מסונתז ב-numpy בסנדבוקס כמו בפרק 1 של הסדרה, או להילקח ממקור רויאלטי פרי עם התנאים המסחריים מאושרים בכתב לפני ההגשה. רישיון מוזיקה הוא הדבר שהכי מפיל הגשה נקייה בשתי התחרויות.",
      "שוט 7 הוא הפתרון לבעיה שאין לה פתרון אחר: הטיפול ביקש גרף עולה עם מספר, ומספרים בפרומפט מייצרים זבל. במקום גרף יוצר מערך פיזי של מוטות אלומיניום שעולים במדרגות, בלי שום סימון, והמספר נוסף בעריכה מעל השטח הנקי. אותו טריק חוזר בשוטים 9 ו-10, שבהם מסך הטלפון הוא שדה אור או גרדיאנט ולא ממשק.",
      "שוטים 19 ו-20 הם פלייטים, כלומר פריימים שנוצרו במפורש כדי שיהיה עליהם מקום ריק לטקסט של העריכה. שוט 19 משאיר את כל החצי העליון שחור ללוגו, ושוט 20 משאיר שבע שמיניות מהפריים שחורות לאותיות הקטנות.",
      "שוט 16 הוא השוט היחיד בסרט עם סיכון קפיאה, כי הוא ארוך והדמות בו יושבת. הוא כבר נכתב עם Continuous motion throughout בפתיחה ועם שלוש פעולות פיזיות מפורשות. אם הוא בכל זאת חוזר סטטי, לא להוסיף פעלים, אלא לפצל אותו לשני קליפים ולחבר בעריכה על תנועת היד.",
      "הקאט השני: מאותו חומר בדיוק יוצא קאט של ארבעים וחמש שניות ב-9:16 לרשתות, והוא שוטים 2, 4, 8, 14, 19 ו-21 בלבד. אותו נכס, שני ערוצים, בלי לייצר סט שני של פריימים.",
      "עובדה אחת שאסור להכניס לסרט: אין שום מוצר אמיתי שמתרגם חתולים ברמה הזאת, ואסור לרמוז שיש. הסרט מומצא לגמרי ואם הוא מוגש לתחרות, גילוי נאות של הפייפליין צריך לומר את זה במפורש, במיוחד באסטנה שדורשת גילוי מלא."

    itemsEn: [
      "Motion character in one sentence: two motion languages that refuse to acknowledge each other. A polished product language, slow, rotating, in slow motion and rim light, against a cat language that is its exact opposite: does not cooperate, does not look at camera, and does not do a single thing the presentation claims. The joke lives in the gap, so the two languages never mix inside one shot.",
      "Editing grammar, set 11 Aug. Extreme close-ups: exactly three and never a fourth, the pupil in shot 3, the microphones, and the collar lighting up at night. The third is the only one that is not funny and that is the point. Burst: one, shot 15, the feature montage after the demonstration, three or four cuts of one to one and a half seconds. The same technique that builds tension, here serving comedy. Slow motion: the cat reveal at the opening, and optionally the collar dropping to the floor in the last shot.",
      "Shot 16 is the only one where product language disappears entirely. No rim, no gradient, no rotation, no music, and no camera movement. Put music there and it becomes a sad scene in an advert. With nothing, it suddenly becomes the real film, and everything before it becomes preparation.",
      "The cat does not cooperate in any shot. If a clip comes back with the cat looking at camera with interest or reacting to the device, reject it even if it is charming, because the non-cooperation is the entire joke.",
      "This film's gate: shot 16, the kitchen floor at night. Render it alone before producing any other shot. If it does not land, the film is only a funny advert and is not worth the entry.",
      "Burst arithmetic, a rule for all the films: Kling will not produce a clip under three seconds, so a one-and-a-quarter-second cut is not a short generation but a three-second clip trimmed in the edit. A five-cut burst costs fifteen seconds of generation for six seconds of film. That is deliberate waste and it is worth it, because it is the only tool that puts physical tension into a viewer.",
      "Ask Kling for slow motion in the prompt; never stretch with setpts in the edit. Stretching without frame interpolation looks bad beyond roughly 1.5x, and that is the bug that cost four films in the series. The wording that works opens with high speed camera slow motion and describes the action as if it lasts four times longer. Bonus: at that speed physics and momentum errors stop reading, which is exactly what the film that won a hundred and fifty thousand dollars did.",
      "Sound envelope, the same shape in all three films and deliberately so: continuous everyday sound rises gradually across two thirds, becomes dense and oppressive in the burst, then falls to zero just before the payoff, and the payoff itself plays in silence. Absolute silence is the strongest effect available and it only works if something was built before it.",
      "Animation order, by risk rather than by shot number: first one gate per film whose failure means the film does not run, then three or four anchors that allow a rough cut, then all the close-ups and object shots which are the cheap safe ones, and the bursts and slow motion last, because their exact length in the cut has to be known before they are generated.",
      "Runtime correction, and this is the third in a row: the treatment said 2:40, which would have auto-rejected the film at Astana and put it under the Higgsfield floor. The shot durations sum to 228 seconds, which is 3:48, and the film qualifies for both contests without changing a single shot. Always sum the table.",
      "The one risk that can kill this film is a wink. No shot admits it is a joke, no performer raises an eyebrow, and the voice-over does not change register even on the four hundred thousand hours line. The funniest line in the film, the small print in shot 20, is delivered with no emphasis at all.",
      "Character lock: two four-view character sheets, one for the cat and one for the man in shot 16, and every shot they appear in was generated from the sheet as an image reference plus a verbatim lock string. A cat is a harder case than a person because its markings are small, so the lock string here names three markings rather than two: the white chest blaze, one white forepaw, and a torn notch in the left ear.",
      "All twenty one frames are already generated in Nano Banana Pro at 16:9 and wired into the cards here. What remains is animation, narration, music and the edit.",
      "One style string is not enough for this film, so there are four, and each card carries its own in a `style` field: product studio, polished domestic, real domestic, and testimonial. This deliberately breaks the usual one-string-per-film rule, because in this film the switching of visual language IS the content.",
      "There is no music model in Higgsfield. The product-launch score has to be synthesised in numpy in the sandbox as in episode 1 of the series, or taken from a royalty free source with the commercial terms confirmed in writing before submission. Music licensing is the single most common disqualifier at both contests.",
      "Shot 7 is the answer to a problem with no other answer: the treatment asked for a rising graph with a number on it, and numbers in a prompt produce garbage. Instead of a graph, a physical array of aluminium bars rising in steps was generated with no markings at all, and the number is added in the edit over the clean area. The same trick recurs in shots 9 and 10, where the phone screen is a field of light or a gradient rather than an interface.",
      "Shots 19 and 20 are plates, meaning frames generated specifically so that there is empty room on them for the edit's text. Shot 19 leaves the entire upper half black for the logo, and shot 20 leaves seven eighths of the frame black for the small print.",
      "Shot 16 is the only shot in the film carrying freeze risk, because it is long and its character is seated. It is already written with Continuous motion throughout at the opening and three explicit physical actions. If it still comes back static, do not add verbs, split it into two clips and join them in the edit on the hand movement.",
      "The second cut: a forty five second 9:16 cut for social comes out of exactly this material, and it is shots 2, 4, 8, 14, 19 and 21 only. One asset, two channels, without generating a second set of frames.",
      "One thing that must not enter the film: there is no real product that translates cats at this level, and the film must not imply that there is. It is entirely invented, and if it is submitted, the pipeline disclosure needs to say so explicitly, particularly at Astana which requires full disclosure."
    ]
