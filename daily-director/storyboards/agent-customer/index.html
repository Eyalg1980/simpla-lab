    en: "On July 29, 2026 MoonPay launched PayBox, a payment vault installed as a custom connector inside Claude and ChatGPT that lets an AI agent transact without anyone, MoonPay included, holding the keys. It ships with two modes: Always Ask, where every transaction is approved with a passkey, and Autonomous, where the agent acts alone within a user-set ceiling. Keys are split with MPC and run inside TEEs, and card payments go through Visa's protocol without storing the raw number. CEO Ivan Soto-Wright framed it in a line that stuck with me: the card hid the cash, the phone hid the card, and this is the era where money disappears into conversation.\n\nThe other side of the equation is how many people are actually there. NIQ reported on May 5, 2026 that 42 percent of consumers used at least one AI tool to shop in the past month, but only 10 percent engaged with an AI shopping assistant and only 5 percent let a fully autonomous agent place an order. The sample is small, roughly 500 US consumers a month in their Quick Question tracker. In parallel Salesforce reported on July 28, 2026 that agentic search grew 200 percent year over year, that AI-chat-referred traffic grew between 150 and 428 percent, and that traditional search declined 15 percent between August 2025 and May 2026. Their Caila Schwartz put it plainly: customers are not starting with ten blue links anymore, they are asking an AI what to buy.\n\nUnderneath both headlines sits the thing that actually changes our work. The Agentic Commerce Protocol, maintained by OpenAI and Stripe from its September 29, 2025 version through the April 17, 2026 release, includes a Product Feed specification. It tells a merchant exactly what to publish: id, title, description, price, availability, seller name, seller URL, privacy policy and terms of service. In TSV, CSV, XML or JSON, pushed over encrypted HTTPS, accepted as often as every fifteen minutes. That feed is what powers product matching, indexing and ranking inside ChatGPT. Which means the agent is not browsing your site. It is reading the list you prepared for it.\n\nThe angle I leave open: our entire design practice was built around an eye. Visual hierarchy, contrast, attention, the moment of falling in love with a shelf. Now there is a second buyer who sees nothing and decides on a text field. The question is not how to optimize for it. The question is what happens to the window display once it no longer talks to whoever decides, and what we as designers build instead. I do not have an answer yet. I have a shop with two storefronts."

    itemsEn: [
      "Locking the SHOP is the method here, not just locking characters. The shot 4 still is the master reference and is injected into all seven other frame prompts. Without it the shelves change shape shot to shot and it reads as eight different shops.",
      "Two complete sets were generated separately, 9:16 primary and 1:1 for the feed. They are not crops of each other: in the square, shot 8 moves from a left-right split to a top-bottom split and the visual point changes with it.",
      "Every frame prompt opens with the same locked style string and ends with no text. All Hebrew is added in the edit, never inside the generation.",
      "Animation is done: Kling 3.0 std, five seconds per shot, audio off at generation, using the approved still as the start frame. Shot 7 is the only one that ran on Veo 3, because a timelapse with real object snapping is what it does best. The eight clips hang on the stills/video switch in the shot list, and the player at the top runs them back to back as a rough cut.",
      "Only the 9:16 set was animated. The 1:1 set is still frames; in square mode the video switch falls back to the stills. The 25 second square version will need its own animation pass, since it is not a crop of the vertical.",
      "Shot durations run 4 to 6 seconds and every clip is 5. Long shots are stretched with setpts and short ones are trimmed, so no shot is sped up.",
      "Transitions: a 0.3 second dissolve between every pair of shots, with no hard cut anywhere in the film. That is a decision, not laziness.",
      "Clips render with the model's audio on. Mute it entirely and replace with sound design: room tone, a clock, two door bells, the teal hum, and dry clicks in the timelapse.",
      "Music enters only at shot 3, when the robot walks in, and stops on the last word of shot 8.",
      "One end card in Rubik 900, coral on cream, held for two seconds: you have two customers now, only one of them is looking.",
      "The voice-over track in the dialogue section is for the LinkedIn version only, where something needs to be readable with sound off. The primary Instagram and TikTok cut is silent.",
      "A 25 second square version drops shots 2 and 6 and opens straight on shot 3, to land the hook in the first second.",
      "The 1:1 frame from shot 8 is the cover image for the written post on the same subject, and this backstory is the raw material for that post, dates and figures included. One film, one post, one piece of research."
