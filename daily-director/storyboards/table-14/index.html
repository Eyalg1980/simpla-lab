    en: "Timecode. An empty hall. The videographer powers up, checks, squares the frame. He is professional and boring, and we see exactly what a client pays for: the couple, the room, the flowers, correct video.\n\nDuring the couple's first dance, in the middle of a perfectly competent shot, the camera drifts. It pans left and settles on table fourteen, where a woman of eighty is straightening a man's collar. The shot holds one second longer than it should, then hurries back to the couple.\n\nFrom there it becomes a pattern. Speeches, cake, guests, and every time the camera returns to table fourteen something has advanced. She takes his hand. He writes something on a napkin. He moves his chair ten centimetres closer, and it looks like a whole life's decision.\n\nThe videographer starts committing. He changes sides. He gets low. He is making directorial choices and we can see he has no idea he is doing it, because he keeps shooting what he is supposed to as well. A voice off-frame demands the cake, he executes a hard whip pan and misses it. We watch him miss it.\n\nThen the moment. The man at table fourteen stands and offers her his hand. They dance at the edge of the floor, in the dark beyond the lit area, badly, and nobody in the room is watching them. The videographer holds. It is the longest shot in the film, forty-two seconds, without a single cut.\n\nA low-battery warning appears. He does not stop. They sit back down, she does not let go of his hand, and the camera lowers slowly and comes to rest on their two hands on the tablecloth.\n\nREC stops. The timecode freezes. Black. Then one card, in the style of a raw-footage folder, saying what became of this material: it never made the film. The thesis: the love story of the evening was in the footage nobody used."
