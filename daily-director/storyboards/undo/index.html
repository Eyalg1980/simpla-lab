    en: "A clay hand presses down hard on a small clay object and crushes it. The shot holds a beat too long, the way that moment always does.\n\nCut to 1976. Two clay researchers in brown suits sit at a bulky beige terminal. On the typed page between them one line is marked in coral: let the user take back the last command.\n\nThey wrote something else too, and that is the beautiful part. Even just knowing you can go back is already calming. A tense clay figure at a keyboard unclenches in front of us, its shoulders drop, the clay of its face smooths out.\n\nOnly at first it was a single step. The figure steps once backwards and stops against an invisible wall. Beyond the wall stretches a long row of things it crushed earlier, close and unreachable.\n\n1983. A hand carves three strokes into the top of a clay key: forward, back, forward. That shape became a reflex for billions of people, none of whom know why it looks like that. Then 1998: a tower of frames rolls backwards and the crushed object repairs itself layer by layer. Time opens up.\n\nThen today. A clay robot sits at a keyboard with one key missing. In its place lies a small grey stone. Beyond the desk, on the floor, are things it already moved, and they do not move back.\n\nThe film lands on a portrait: the clay key on a wooden shelf, and beside it a repaired object with a visible seam nobody tried to hide. The thesis: we taught a machine to forgive, and now we have built one that has not learned yet."

    en: "On 14 December 1976 IBM published an internal research report titled Behavioral Issues in the Use of Interactive Systems, number RC 6326, by Lance A. Miller and John C. Thomas. In its section on recovery philosophy the authors write that it would be quite useful to permit users to take back at least the immediately preceding command, through a special command they call undo. That is the whole sentence. No drama, no vision, and yet one of the most consequential sentences ever written about interface.\n\nThe line that turns it into a film is the one right after. They add that the benefit to the user of being able to withdraw a command, and even just of knowing that the capability exists, could be quite important, for example in easing the acute distress new users feel when they are worried about doing something wrong. Two researchers in 1976 wrote that this button exists partly so you never press it. That is not engineering, that is empathy.\n\nThe idea was already walking around. Bravo, the first WYSIWYG text editor, shipped at Xerox PARC on 14 September 1974, developed by Butler Lampson and Charles Simonyi, and it could undo exactly one action. One step back, then a wall. In 1983 Larry Tesler set the shortcuts for the Apple Lisa and chose the letter Z because it sits next to X, C and V on the keyboard, and also, by his own account, because its shape marks the do-undo-redo triad: a stroke forward, a stroke back, a stroke forward again. Photoshop 5.0, released in May 1998, finally brought multiple undo, and only then did time really open up. Ben Shneiderman states it as the sixth of his eight golden rules: permit easy reversal of actions, because it relieves anxiety and encourages exploration of unfamiliar options.\n\nAnd here is today's angle. I work with an agent that writes files, runs commands and deletes things, and it has no Cmd-Z. It has a checkpoint. The Claude Code documentation says plainly what a checkpoint does not cover: files modified by bash commands, changes made outside the session, and edits applied by subagents. They describe it themselves as local undo rather than a replacement for version control. Which means the more an agent acts in the world, the smaller the net beneath it. We solved the 1976 problem beautifully. We have not started on its 2026 version."
