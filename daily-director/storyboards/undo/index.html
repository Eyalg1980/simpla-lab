    en: "A clay hand presses down hard on a small clay object and crushes it. The shot holds a beat too long, the way that moment always does.\n\nCut to 1976. Two clay researchers in brown suits at a bulky beige terminal, and a typewriter arm strikes a single line onto the page between them, letter by letter. When the line ends a coral stripe is smeared across it by hand: let the user take back the last command.\n\nThey wrote something else too, and that is the beautiful part. Even just knowing you can go back is already calming. A tense clay figure at a keyboard unclenches in front of us, its shoulders drop, the clay of its face smooths out.\n\nOnly at first it was a single step. The figure steps once backwards, hits an invisible wall and stops. It strikes the wall once with an open palm, dust scatters, the wall does not move. Beyond it stretches a long row of things it crushed earlier, close and unreachable.\n\n1983. A hand carves three strokes into the top of a clay key: forward, back, forward. Coral light fills each groove the instant it is cut.\n\n1998. A strip of clay motion-picture film rises vertically through the frame, sprocket holes sculpted along both edges. Every cell holds the same crushed object, each one a little more repaired than the cell below it. Time opens up.\n\nThen the crest: a wide field of dozens of clay figures at keyboards, rows receding into haze, all of them relaxed, all of them lit by the same teal glow. That button became a reflex for billions of people, none of whom asked for it.\n\nThen today. A clay robot sits at a keyboard with one key missing. It presses the empty socket twice and nothing happens. A small grey stone lies beside it. On the floor beyond the desk are things it already moved, and they do not move back.\n\nA moment of respect: a sculpted coral clay arrow, a thick loop that rises, curves over and comes back to a blunt triangular head. It stands alone on a wooden shelf under a single spotlight, like a museum piece. The monument to that button.\n\nAnd the ending. A warm rectangle of light lies across a clay desk, and inside it objects knit themselves back together, seam by seam. The camera pulls back, crosses the edge of the desk, and reveals that just past the line of light, on the cold floor, broken things lie completely still. The boundary between warm and cold is razor sharp. Four seconds of total silence, and out."

ngs in the soft hum of dozens of keyboards, cut dead the instant we cut to shot 8. Total silence for the last four seconds, no music, only air."

  story: {

    paras: [
      "ב-14 בדצמבר 1976 יצא ב-IBM דוח מחקר פנימי בשם Behavioral Issues in the Use of Interactive Systems, מספר RC 6326, מאת לאנס א. מילר וג'ון סי. תומאס. בפרק על פילוסופיית התאוששות הם כותבים שיהיה שימושי מאוד לאפשר למשתמשים לקחת בחזרה לפחות את הפקודה שקדמה מיד, באמצעות פקודה מיוחדת שהם קוראים לה undo. זה כל המשפט. אין בו דרמה ואין בו חזון, ובכל זאת הוא אחד המשפטים המשפיעים ביותר שנכתבו על ממשק.",

    ],
    en: "On 14 December 1976 IBM published an internal research report titled Behavioral Issues in the Use of Interactive Systems, number RC 6326, by Lance A. Miller and John C. Thomas. In its section on recovery philosophy the authors write that it would be quite useful to permit users to take back at least the immediately preceding command, through a special command they call undo. That is the whole sentence. No drama, no vision, and yet one of the most consequential sentences ever written about interface.\n\nThe line that turns it into a film is the one right after. They add that the benefit to the user of being able to withdraw a command, and even just of knowing that the capability exists, could be quite important, for example in easing the acute distress new users feel when they are worried about doing something wrong. Two researchers in 1976 wrote that this button exists partly so you never press it. That is not engineering, that is empathy.\n\nThe idea was already walking around. Bravo, the first WYSIWYG text editor, shipped at Xerox PARC on 14 September 1974, developed by Butler Lampson and Charles Simonyi, and it could undo exactly one action. One step back, then a wall. In 1983 Larry Tesler set the shortcuts for the Apple Lisa and chose the letter Z because it sits next to X, C and V on the keyboard, and also, by his own account, because its shape marks the do-undo-redo triad: a stroke forward, a stroke back, a stroke forward again. Photoshop 5.0, released in May 1998, finally brought multiple undo, and only then did time really open up. Ben Shneiderman states it as the sixth of his eight golden rules: permit easy reversal of actions, because it relieves anxiety and encourages exploration of unfamiliar options.\n\nAnd this is where the icon itself comes in. The curved arrow doubling back is one of the very few interface shapes every person on earth reads without explanation, translation or a manual. It does not represent a technical operation, it represents a gesture: take that back. In this episode it gets a shot of its own, sculpted in clay and standing on a shelf, because that is exactly what it is. A small monument to the idea that you are allowed to regret something.\n\nAnd here is today's angle. I work with an agent that writes files, runs commands and deletes things, and it has no Cmd-Z. It has a checkpoint. The Claude Code documentation says plainly what a checkpoint does not cover: files modified by bash commands, changes made outside the session, and edits applied by subagents. They describe it themselves as local undo rather than a replacement for version control. Which means the more an agent acts in the world, the smaller the net beneath it. The checkpoint is a rectangle of light on the desk, and everything the agent did outside that rectangle stays exactly where it is. We solved the 1976 problem beautifully. We have not started on its 2026 version."
  },

  notes: {
    title: "מה עושים עם הפריימים האלה",
    items: [
      "כתוביות, סבב RTL: הטקסט נלקח משדה sub של כל בלוק קריינות כשהוא קיים, ומ-text כשלא, ואף פעם לא נגזר מחדש. מעל זה כל שורת תצוגה עטופה ב-RLE ו-PDF כדי לכפות כיוון פסקה מימין לשמאל, כי שורה שנפתחת בספרה כמו 1983 נקראת אחרת לגמרי. היישור עבר לימין (Alignment 3), הגופן ל-Rubik 44, והשבירה לשתי שורות מאוזנת לפי אורך ולא לפי הנקודה, אחרת השורה הארוכה נגעה בקצה השמאלי של הפריים.",
      "בדיקת הכיוון היא מדידה ולא הערכה: מרנדרים את אותה שורה עם נקודה ובלעדיה ומשווים את תיבת הדיו. אם התיבה גדלה שמאלה והקצה הימני לא זז, הפיסוק בצד הנכון. בקאט הזה היא גדלה ב-10 פיקסלים שמאלה והימני נשאר במקומו.",
      "הקאט הראשון עלה לראש הדף (1.8). כל שוט נחתך לאורך בלוק הקריינות שלו, כך שהתמונה והקול נעולים: 4.5, 7.9, 5.8, 4.3, 7.2, 6.5, 5.7, 6.6, 3.7 שניות, ואז שוט 10 במלואו עד 60.2 והקפאה של הפריים האחרון עד 62.6. שוטים 5 ו-6 היו קצרים ב-0.2 וב-0.5 שניות מהבלוק שלהם, אז הפריים האחרון שלהם מוחזק להשלמה.",
      "מה עוד לא בקאט: מוזיקה, קליקים של חימר ונשימת חדר. הקריינות והכתוביות כבר בפנים, אז אפשר להוסיף מוזיקה מתחת בלי לגעת בתזמונים.",
