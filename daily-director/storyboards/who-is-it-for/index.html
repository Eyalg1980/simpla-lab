    en: `In 1967, at BBN in Cambridge, three people built a programming language designed from the start for children: Wally Feurzeig, Cynthia Solomon and Seymour Papert. They called it Logo, and the first thing a child could do with it was tell a turtle to move and watch a line appear. That sounds small, but it was a full inversion: the computer stopped being something you learn about and became something you build with.
