There’s a room before the room. The curtain opens on an empty stage and a pool of light, and the phone slides in. Backstage is that room. Laura chooses who will ask her the hard question, and the shapes that were in chaos settle into a row. She chooses Nora, the one who steadies you first.

    en: `In 1956 the sociologist Erving Goffman published The Presentation of Self in Everyday Life at the University of Edinburgh, and the 1959 American edition made it a classic. His argument is that everyday life is a performance: there is a front region, the stage, where we perform for an audience, and a back region, the backstage, where we prepare, rehearse and drop the mask. The app’s name, and the structure of this film, come straight from there.

In 2011 James Pennebaker, a psychologist at the University of Texas at Austin, published The Secret Life of Pronouns. One of his more surprising findings: in a conversation between two people, the one with higher status uses the word “I” less. So “we” is not always weakness; sometimes it is the language of leaders. That is why the film never tells Laura to stop saying “we”. It tells her that in this particular room, it makes her work invisible.
