    en: "Tone: patient and curious, never excited. This is someone taking apart an object he touches every day and discovering it is no longer the same object. No twist, only accumulation. What should remain at the end is a small respect and a small discomfort: this box works for you, and it also decides for you.\n\nPacing: the first three shots are slow and dead, the object does not move. Shot 3 is the first sign of life. From shot 4 the pace steps up every shot until the peak in shot 8, and shot 9 stops completely.\n\nCamera: exactly one move per shot, never two. Two shots are fully locked off, 2 and 6, and they are the most important in the film: there the material acts on its own and the camera must not take credit for it.\n\nMaterial: everything is clay, including the rulers and the dashed threads. There is no second material. Only two backgrounds: warm cork through shot 8, wood in shot 9. The change between them is the story.\n\nLight: one soft source from the upper left, identical in all nine shots. All change comes from the object, never from the lighting.\n\nGlow: the single deliberate break from the series rule that everything is matter. A first coral ember in the seams in shot 6, the engraving still dark in shot 7, full ignition in shot 8 when the foreign hands arrive, a low steady ember in shot 9. The glow is not an effect, it is the moment the box starts to decide.\n\nSound: no music. Five effects in total: a pin press in shot 1, a clay click in shot 3, three consecutive clicks as the tiles close the gap in shot 6, a low hum igniting with the engraving in shot 8, and a dry set-down on wood in shot 9. Everything else is a quiet room."

    paras: [

    enLabel: "English backstory",
    enCopyLabel: "Copy English backstory",
    en: "Most designers say Figma replaced the artboard with the frame. I went looking for that moment and could not find it. There is no post and no release note announcing a rename. What actually happened is more interesting: Figma 1.0 shipped on 27 September 2016 and never had artboards at all. It was born with the frame. Figma's own best practices page says exactly this, that what you know as an artboard in other tools is what they call a frame, and that they see it as a foundational element acting as a top level container, like a device viewport. The difference is not the name. An artboard is a page. A frame is a container.\n\nThe sharpest line in the whole story is not in a marketing post but in the Plugin API docs: the frame node is a container used to define a layout hierarchy, and it is similar to a div in HTML. That is exactly why you can nest a frame inside a frame, give it constraints that decide how children behave when the parent changes, and clip its content. From that moment the box no longer holds a drawing. It holds relationships.\n\nFrom there it only accumulated. Auto Layout landed on 5 December 2019, and Figma wrote that the goal was for designing interfaces in Figma to feel a bit more like building interfaces with code. The rewrite was announced at Config Europe on 17 September 2020 and shipped that November, defined as a thoughtful subset of flexbox. June 2023 added wrap and min and max sizing, and at Config 2025 on 7 May, Grid arrived as an Auto Layout option. In parallel the box gained a second audience: Dev Mode was announced at Config 2023 on 21 June, and Code Connect on 16 April 2024, replacing auto generated CSS with the design system's real code. The frame stopped being only a picture and became a specification too.\n\nThe last year is what turned this into a film. In June 2025 Figma shipped the Dev Mode MCP server so models could read design context, and in March 2026 it opened the canvas itself to agents, with a tool that writes directly into files and Skills, markdown files that shape how agents build on the canvas. At Config 2026 Code Layers arrived in closed beta, bringing working code onto the canvas as a new layer type. That is where my story ends and the question starts: the box began as a mark saying where the drawing ends, and it already holds rules, a spec, code, and hands that are not yours. If the rule lives inside the box, what exactly is left for the designer to hold."
