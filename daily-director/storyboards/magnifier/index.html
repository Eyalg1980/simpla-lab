    copyHead: 'סיפור הרקע לסרט "ביוגרפיה של אובייקט · פרק 3: הזכוכית המגדלת מאבדת את התיבה":',

    en: "Keith Ohlfs joined NeXT in the spring of 1987, straight out of school, and drew almost every icon in the system on a 48 by 48 pixel grid, two bits deep. He is also the man who gave us the spinning wait cursor. In an interview Patrick Ward published on 2 January 2015 he explains how the magnifying glass was chosen, in his own words: he was trying to equate the magnifying glass with finding a needle in a haystack, and for that metaphor a magnifier is more useful than a pair of binoculars, a librarian or a telescope. He used it in two places, the Workspace Manager's Find function and the ColorPicker, and closed the answer with the most professional sentence in the story: he killed three birds with one stone and actually got some sleep that night. Worth knowing that the whole account rests on that single interview, and Ohlfs died in October 2016 at 52, so there is nobody left to confirm or deny it.\n\nThree years later the shape met its first real test. Raymond Chen, a veteran Microsoft engineer, wrote one sentence on his blog on 3 June 2025 that is this entire film: the WinHelp team received a question from one of the overseas offices asking why the icon for Search was a frying pan. Chen explains that the magnifying glass metaphor comes from the detective image in English literature, and that this is not necessarily well known in other cultures. Their solution in Windows 3.1 was not to draw a better icon. They removed the icons entirely.\n\nThe shape came back and won, and then gave up the word beside it. On 23 February 2014 Katie Sherwin of Nielsen Norman Group published a study of this icon, and its finding separates two things people tend to confuse. Most people in their studies recognise and understand the magnifying glass, but the glass alone makes the search much harder to locate on the page. The comprehension battle ended long ago. The location battle is still running. Their recommendation was to keep an open text field next to the icon on desktop, which is precisely what most products stopped doing.\n\nAnd here is where it stands now. Rand Fishkin's SparkToro published on 9 June 2026, using Similarweb panel data, that 68.01 percent of US Google searches between January and April 2026 ended without a single click. Pew measured it from a different angle and published on 22 July 2025: when an AI summary appears at the top of the results, 8 percent of visits included a click on a traditional result. Without a summary, 15 percent. And on 19 May 2026 Google itself called it the biggest upgrade to our Search box in over 25 years, and reported that AI Mode had passed one billion monthly users. The angle that interests me is not the statistic. Ohlfs drew a tool that assumes there is a haystack, meaning there is somewhere to look and somebody will have to rummage. The icon survived forty years precisely because that metaphor held. I have no idea what an icon looks like for a world where the haystack answers you itself, and I am not sure anyone has tried to draw it yet."
