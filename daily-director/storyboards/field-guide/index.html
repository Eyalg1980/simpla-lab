    enCopyLabel: "Copy English direction",
    en: "Tone: the film plays itself with complete gravity from both ends at once. The narration is entirely serious, and the couple are entirely ordinary. Neither side knows it is in a comedy, and the whole joke is born from exactly that gap, at zero technical cost. Then, in the final third, that same gap turns into tenderness, because the form that made us laugh is also the form that misses the moment.\n\nLenses: the entire film runs on 85 to 135mm wide open. That is both the real grammar of distant wildlife photography and the technical defence: the aisle collapses into complete bokeh and any person who is not one of the two protagonists becomes a smear. There is no wide shot of the shop floor anywhere in this film.\n\nHour: everything is shot at opening time. The floor is still wet, the shelves are full, and there are no shoppers. This solves the crowd problem in the location rather than in the prompt, and it is also true to this couple: people who arrive when it opens.\n\nCamera: handheld throughout, with small imperfect reframes, as though a real operator is following and does not want to be caught. Never too clean and never too shaky. There is not one deliberate camera move in the whole film.\n\nPacing: long and unhurried in the first third while the viewer learns the game, tightening in the middle as the jokes accumulate, then almost stopping from shot 14 onward. Shot 15 is the longest in the film and also the quietest.\n\nSound: full, real supermarket ambience. Chiller hum, trolley wheels on linoleum, a distant radio behind a door, a scanner at the checkout. The sound is what makes the place a place. There is no added music at any point, because music would signpost the joke and kill it.\n\nThe hard rule: neither of them speaks, looks at the camera, or knows they are being filmed. There is not one line of synced dialogue in the film. Everything that passes between them passes through objects and postures, exactly as in The Neighbour."
  },

      "ובעברית יש לזה שכבה נוספת שאין באנגלית. דור שלם בישראל הכיר את הפורמט הזה לא במקור אלא בדיבוב, וכתוב הדיבוב הוא ז'אנר בפני עצמו: מוסמך, מעט ארכאי, נוטה למשפטים קצרים ולנוסח שאף אחד לא מדבר בו באמת. המשלב הזה מזוהה מיידית לכל צופה ישראלי, וזה בדיוק החומר שהסרט הזה עשוי ממנו. זו גם הסיבה שהחלפנו את הקריינות מאנגלית לעברית: באנגלית זה חיקוי, בעברית זה זיכרון.",

      "ומה שנשאר פתוח הוא לא בדיחה בכלל. מדריך שדה טוב יודע לתאר כל דבר שאפשר לראות. הוא יודע לומר מי מוביל, מי מוותר, מי מסמן ומי מתעלם. הוא לא יודע לומר למה גבר בן שישים וחמש מחזיר גבינה שהוא רצה כל השנה. הסרט מסתיים כשהקריין נגמר, וזה קורה בדיוק כשמשהו סוף סוף קורה."

    enLabel: "English backstory",
    enCopyLabel: "Copy English backstory",
    en: "The nature documentary has a grammar so stable that you can borrow it whole and put anything at all underneath it. It is built from three fixed components: an authoritative voice that never appears in frame, a long lens shooting from a distance so as not to disturb, and a fixed vocabulary of behaviours, territory, hierarchy, courtship display and boundary marking. Those three components work exactly the same way whether what is in front of them is a herd of elephants or two people in the dairy aisle.\n\nAnd in Hebrew there is an extra layer that does not exist in English. An entire generation in Israel met this format not in the original but in dubbing, and dubbing script is a genre of its own: qualified, slightly archaic, inclined toward short sentences and phrasing nobody actually speaks in. That register is instantly recognisable to any Israeli viewer, and it is exactly the material this film is made of. It is also why the narration was switched from English to Hebrew: in English this is an imitation, in Hebrew it is a memory.\n\nThe technical choice that holds the film up is genuinely the same choice that holds the joke up, which is rare. A nature film is shot on a long lens from a distance so as not to startle the subject, and that is exactly what is needed here: a long lens wide open collapses an entire supermarket aisle into blobs of light, and in doing so removes from the equation the one thing that would break this film in photoreal, a crowd. Shooting at opening hour does the rest.\n\nAnd what stays open is not a joke at all. A good field guide can describe anything you can see. It can tell you who leads, who yields, who marks and who ignores. It cannot tell you why a man of sixty five puts back a cheese he has wanted all year. The film ends when the narrator runs out, and that happens at exactly the moment something finally happens."
  },

      "לרעיון הזה לא היה טיפול כתוב, רק כרטיס רעיון. הטיפול, השוט-ליסט, הקריינות והאווירה נכתבו מאפס כאן. שני שינויים מודעים מול הכרטיס: הקריינות עברה מאנגלית לעברית, והאורך עלה משלוש דקות ל-3:54 כדי לתת לשליש האחרון את הזמן שהוא צריך.",
      "הסיכון האמיתי היחיד בסרט הוא המונים, וזה בדיוק מה שמתפרק הכי חזק ריאליסטית. ההגנה כאן משולשת ומובנית לתוך הרעיון ולא מודבקת עליו: הכל מצולם בשעת הפתיחה כשהחנות ריקה, הכל על 85 עד 135 מילימטר פתוח לגמרי כך שכל דבר מעבר לנושא הוא בוקה, ואין בסרט אף שוט רחב על רצפת הסופר. אחד עשר מתוך שמונה עשר השוטים הם ידיים, אובייקטים או גב.",
      "היופי במקרה הזה הוא שההגנה הטכנית והבדיחה הן אותה בחירה. עדשה ארוכה ממרחק היא הדקדוק של סרט טבע, ולכן כל פריים שנועד להסתיר קהל גם נראה יותר כמו סרט טבע. אין כאן פשרה בין מה שנכון לסרט למה שנכון למודל.",
      "נעילת דמות: שני גיליונות דמות בארבע תצוגות, אחד לו ואחד לה, וכל שוט שבו הם מופיעים יוצר מהגיליון כרפרנס תמונה פלוס מחרוזת נעילה זהה מילה במילה. גיליון הדמות שלהם כולל במפורש תצוגה מגב, כי חמישה שוטים בסרט מצולמים מגבם והפוטנציאל לדריפט שם גבוה במיוחד.",
      "כל שמונה עשר הפריימים יוצרו ב-Nano Banana Pro ב-16:9 ומחוברים לכרטיסים כאן. שוט 8 נפל בסבב הראשון והוגש מחדש בלי שינוי בפרומפט, וזה הכשל היחיד מתוך שלושים ותשעה פריימים בסבב הזה.",
      "אף פרומפט לא מכיל אף מילה של טקסט, וזה קריטי במיוחד בסרט שמתרחש בסופר, כי סופר הוא סביבה שמלאה באריזות ובשלטים. בכל פרומפט התוויות מוגדרות כלא קריאות, מטושטשות או ריקות: הפתק של שוט 10 הוא כתב יד בלתי קריא בכוונה, פס המחיר בשוט 12 מוגדר ריק ומחוץ לפוקוס, והספרור בשוט 13 הוא נייר לבן ריק.",
      "מותגים: אין בסרט הזה אף לוגו ואף אריזה מזוהה, וזה לא רק כלל של פרומפט אלא צורך משפטי. ברגע שרואים מותג אמיתי, הסרט הופך לפרסומת לא מורשית והגשה לתחרות נעשית בעייתית. אם פריים חוזר עם משהו שנראה כמו מותג אמיתי, לרנדר אותו מחדש ולא לתקן בעריכה.",
      "אין מוזיקה בסרט הזה בכלל, וזו החלטה ולא חיסכון. פסקול היה מסמן לצופה שזו בדיחה, והרגע שהוא מבין שזו בדיחה הוא הרגע שהפורמט מפסיק להתיר את הפגמים. מה שכן צריך זה עבודת סאונד רצינית: המהום מקררים, גלגלים על לינולאום, רדיו מרוחק, וסורק. ההגשות בתחרויות מדרגות סאונד דיזיין במשקל שווה לנרטיב.",
      "שוט 15 הוא הלב של הסרט וגם השוט שהכי קל לקלקל. הוא ארוך, הדמות בו כמעט לא זזה, וזה בדיוק המתכון לקליפ קפוא. הפרומפט כבר כתוב עם פעולה פיזית אחת מדויקת, נשיפה ומצמוץ איטי, ועם משפט מפורש על מה לא זז. אם הוא בכל זאת חוזר קפוא, לא להוסיף פעלים, אלא להחיל zoompan דיגיטלי איטי על הסטיל בעריכה. זה מתמטית אפס תנועה פנימית וזה תמיד עובד.",
      "סדר ההפקה: כאן הקריינות היא רוב הסרט, ולכן הכלל של הסדרה הוא קריטי במיוחד. קודם מקליטים את ארבע עשרה שורות הקריין, מודדים עם silenceremove ו-loudnorm, ורק אז מייצרים כל קליפ באורך שנמדד. ארבעת השוטים האחרונים אינם תלויים בקריינות בכלל, אז את האורך שלהם קובעת העריכה.",
      "הקול: זה צריך להיות קול גברי עברי ילידי ומבוגר, לא רב לשוני, כי כל מבטא זר הורס את המשלב של הדיבוב. במנוע inworld יש רק שני קולות עברית, Yael ו-Oren, ואורן הוא הכיוון כאן. כדאי להשוות אותו מול מיניmax על שורה אחת לפני שמקליטים את כל הארבע עשרה.",
      "הנכס הכפול: אחד עשר השוטים שאין בהם פנים הם סט תמונות עצמאי לגמרי, וסיפור הרקע כאן הוא חומר גלם מוכן לפוסט על דקדוק של סרטי טבע כמכשיר עיצובי. אותו נכס, שני ערוצים."

    itemsEn: [
      "This idea had no written treatment, only an idea card. The treatment, shot list, narration and direction were all written from scratch here. Two deliberate changes from the card: the narration moved from English to Hebrew, and the runtime went from three minutes to 3:54 to give the last third the time it needs.",
      "The only real risk in the film is crowds, and crowds are exactly what breaks hardest in photoreal. The defence here is threefold and built into the idea rather than bolted onto it: everything is shot at opening hour when the store is empty, everything is on 85 to 135mm wide open so anything beyond the subject is bokeh, and there is no wide shot of the shop floor anywhere. Eleven of the eighteen shots are hands, objects or backs.",
      "The beauty of this case is that the technical defence and the joke are the same choice. A long lens from a distance is the grammar of a nature film, so every frame designed to hide a crowd also looks more like a nature film. There is no compromise here between what is right for the film and what is right for the model.",
      "Character lock: two four-view character sheets, one for him and one for her, and every shot they appear in was generated from the sheet as an image reference plus a verbatim lock string. Their sheets deliberately include a view from behind, because five shots in the film are shot from behind them and the drift potential there is unusually high.",
      "All eighteen frames were generated in Nano Banana Pro at 16:9 and are wired into the cards here. Shot 8 failed on the first pass and was resubmitted with no change to the prompt, and that is the only failure out of thirty nine frames in this round.",
      "No prompt contains a single word of text, which matters particularly in a film set in a supermarket, since a supermarket is an environment made of packaging and signage. In every prompt the labels are defined as illegible, blurred or blank: the note in shot 10 is deliberately unreadable handwriting, the price rail in shot 12 is defined as blank and out of focus, and the deli ticket in shot 13 is blank white paper.",
      "Brands: there is no logo and no recognisable packaging in this film, and that is not only a prompt rule but a legal necessity. The moment a real brand is visible, the film becomes an unauthorised advertisement and submission becomes a problem. If a frame comes back with something that looks like a real brand, re-render it rather than patching it in the edit.",
      "There is no music in this film at all, and that is a decision rather than a saving. A score would signal to the viewer that this is a joke, and the moment they understand it is a joke is the moment the format stops licensing the flaws. What it does need is serious sound work: chiller hum, wheels on linoleum, a distant radio, a scanner. Contest rubrics weight sound design equally with narrative design.",
      "Shot 15 is the heart of the film and also the easiest one to ruin. It is long, its character barely moves, and that is precisely the recipe for a frozen clip. The prompt is already written with one precise physical action, an exhale and a slow blink, and an explicit sentence about what does not move. If it still comes back frozen, do not add verbs, apply a slow digital zoompan to the still in the edit instead. That is mathematically zero internal motion and it always works.",
      "Production order: here the narration is most of the film, so the series rule matters more than usual. Record the fourteen narrator lines first, measure with silence removal and loudness normalisation, and only then generate each clip at its measured length. The last four shots do not depend on narration at all, so their lengths are set by the edit.",
      "The voice: this needs a native, older, male Hebrew voice, not a multilingual one, because any foreign accent destroys the dubbing register. Inworld offers only two Hebrew voices, and the male one is the direction here. It is worth comparing it against MiniMax on one line before recording all fourteen.",
      "The double asset: the eleven shots with no faces in them are a completely standalone photo set, and the backstory here is ready-made source material for a written post about nature-documentary grammar as a design device. One asset, two channels."
    ]
