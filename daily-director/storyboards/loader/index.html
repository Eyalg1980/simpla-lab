    en: "In April 1985 Brad A. Myers published a paper titled The importance of percent-done progress indicators for computer-human interfaces, in ACM SIGCHI Bulletin volume 16 issue 4. He did not invent the progress bar. He did something else: he tested it. Forty-eight subjects, the same search tasks, once with a percent-done indicator and once without. Eighty-six percent of them preferred the version with the bar, with a mean rating of 2.94 on a scale where 1 is very useful and 9 is useless and annoying, at a significance of 0.0006. Myers wrote that the bar reduces anxiety and lets people plan their time. What he did not write, and this is the heart of the film, is that the bar does not actually know how long is left.\n\nSince then an entire lineage of objects has been built to fill that second. The wristwatch was the first wait cursor on the original Macintosh, HyperCard gave us a black and white quartered beach ball, and NeXTSTEP gave us a cursor resembling a spinning optical disk, whose colour version became the rainbow wheel everyone knows as the Mac spinning beach ball. None of them delivers information. All of them deliver presence.\n\nThen it became an exact science. At CHI 2010, Chris Harrison, Zhiquan Yeo and Scott Hudson published Faster Progress Bars: Manipulating Perceived Duration with Visual Augmentations. They showed you can manipulate how long a wait feels without touching how long it actually is: the strongest version, ribbing inside the bar moving in the opposite direction to the fill at an accelerating rate, shortened the perceived duration by around 11 percent. A year later Ryan Buell and Michael Norton published The Labor Illusion in Management Science, volume 57 issue 9, September 2011. They let people choose between an instant result and a wait in which the work is visible. When the wait was blank, only 23 percent agreed to wait a minute. When they could see the work, 63 percent chose to wait. In 2013 Eytan Adar, Desney Tan and Jaime Teevan gave it a name in Benevolent Deception in Human Computer Interaction.\n\nAnd here is where it lands now. Felicia Fang-Yi Tan, Moritz Messerschmidt, Wen Yin and Oded Nov published a study at CHI 2026 titled The Impact of Response Latency and Task Type on Human-LLM Interaction and Perception. Two hundred and forty participants, identical answers, three time-to-first-token latencies: two seconds, nine, and twenty. The answer that arrived after two seconds was rated less thoughtful than the one that arrived after nine and after twenty, and less useful than the one after nine. The same words exactly. Participants described the longer wait as deliberation. And that is exactly where the film leaves it open: for forty years we taught machines to look busy in order to calm us down, and now the machine can answer too fast, and whoever designs it has to decide whether to slow it down on our behalf. I do not have a good answer to that question, and I am not sure anyone has asked it out loud yet."
  },
