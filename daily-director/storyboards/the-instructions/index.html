    enCopyLabel: "Copy English direction",
    en: "Tone: dry, patient, and without a drop of pity. This is not a film about a lonely old man, it is a film about someone who knows how to work and who finishes a job. All of the emotion sits in the last shot and nowhere before it, which is exactly why the first eighteen shots must be precise and unmoving. The comedy comes from the voice, never from him.\n\nPacing: the first three shots run at the real pace of opening a box. From the jammed dowel in shot 7 the cutting tightens, and from shot 14 it slows and never speeds up again. Shot 19 is twice the length of any other shot in the film.\n\nCamera: tripod only. Eighteen fully locked shots and exactly one move in the entire film, the pull back in shot 16. If the camera moves even one more time, the reveal of the crib stops being an event.\n\nLight: one source from a window at camera left on an overcast day, identical in all nineteen shots. No added light, no fill, and the right third of the room falls two stops under. All change in the film comes from the man, never from the lighting.\n\nMaterial: cardboard, pale plaster, light birch, and one dark garment. There is no fourth colour. The floor is a playing surface rather than a background, and most of the film is shot from floor height because that is where he is.\n\nSound: the film lives on sound. Cardboard, screws on tile, a hand screwdriver, breathing, and room tone. The device voice always sits at the same distance and the same level, including when it says things that are not instructions, because that is what makes them funny and then painful.\n\nMusic: there is no music in the first eighteen shots. In shot 17, after the word thank you, one small barely audible thing enters and it ends before the black. That is the only time the film allows itself to say anything."

  story: {

    copyHead: 'סיפור הרקע לסרט "ההוראות":',
    paras: [
      "האובייקט שהסרט הזה בנוי סביבו נולד מפתרון לוגיסטי ולא מרעיון עיצובי. ב-1956 עובד של איקאה בשם גיליס לונדגרן ניסה להכניס שולחן צד למכונית, לא הצליח, ופירק לו את הרגליים. השולחן הזה, לוֶט, הוא הפריט הראשון שנשלח שטוח, ואיקאה עצמה מספרת את הסיפור הזה כנקודת ההתחלה של כל המודל שלה. היא גם החזירה את השולחן לייצור ב-2013. מה שמעניין בסיפור הוא לא החיסכון בהובלה אלא ההעברה: מאותו רגע חלק מהעבודה עבר מהיצרן אל מי שקנה. אתה לא קונה רהיט, אתה קונה ערכה ומשימה.",
      "ואז נשארה שאלה אחת: איך מסבירים את המשימה הזאת לאדם בשלושים מדינות. התשובה של איקאה היא המדריך חסר המילים, גיליון של איורים בלי משפט אחד, שאותו עותק בדיוק נשלח לכל שוק. זה אחד המסמכים היחידים בעולם המסחרי שנבנה מראש כך שאי אפשר לתרגם אותו, כי אין בו מה לתרגם. גם המשמעות של זה היא העברה: לא רק העבודה עברה אליך, גם ההבנה. אתה לבד מול ציור.",
      "והנה מה שהשתנה בשנים האחרונות ומה שהסרט מתיישב עליו. הליווי חזר, אבל לא בתור אדם. ההוראות מוקראות עכשיו בקול, בטלפון, בפודקאסט של המוצר, בעוזר קולי. ובעברית ובאנגלית כאחד, הקול הזה נשמע קרוב מאוד לקול של מישהו שנמצא איתך בחדר. הוא ענייני, מנומס, סבלני עד אינסוף, והוא לא מתעייף מלחזור על אותו שלב. הוא גם, וזה הקטע, לא יודע שאתה בן שמונים ושתיים, לא יודע מה אתה מרכיב, ולא יודע למה.",
      "מכאן הסרט. אני לא מעניין אותי לשאול אם מכונה יכולה להיות חברה. השאלה שנשארת פתוחה בסוף היא הפוכה וקטנה יותר: כשהדבר היחיד שליווה אותך בשעה הכי קשה נשמע כמו נוכחות ומתנהג כמו נוכחות ואומר בדיוק את המשפט הנכון ברגע הנכון, בלי כוונה ובלי מודעות ובלי שום מושג מה קורה בחדר, האם זה עדיין לא נחשב. הוא אומר תודה בסוף. השאלה היא למי."
    ],
    enLabel: "English backstory",
    enCopyLabel: "Copy English backstory",
    en: "The object this film is built around was born from a logistics fix, not from a design idea. In 1956 an IKEA employee named Gillis Lundgren tried to fit a side table into a car, failed, and took its legs off. That table, the Lovet, is the first item shipped flat, and IKEA itself tells this story as the starting point of its whole model. It even put the table back into production in 2013. What is interesting in the story is not the saving on freight but the transfer: from that moment part of the work moved from the manufacturer to the person who bought it. You are not buying furniture, you are buying a kit and a task.\n\nThat left one question: how do you explain the task to a person in thirty countries. IKEA's answer is the wordless manual, a sheet of drawings without a single sentence, the exact same copy shipped to every market. It is one of the only documents in the commercial world deliberately built so that it cannot be translated, because there is nothing in it to translate. And the meaning of that is also transfer: not only the work moved to you, the understanding did too. You are alone with a drawing.\n\nHere is what changed in the last few years and what the film sits on. The company came back, but not as a person. Instructions are now read aloud, on a phone, in a product's own audio guide, by a voice assistant. And in Hebrew as in English, that voice sounds very close to someone who is in the room with you. It is practical, polite, infinitely patient, and it never gets tired of repeating the same step. It also, and this is the point, does not know that you are eighty-two, does not know what you are assembling, and does not know why.\n\nHence the film. I am not interested in asking whether a machine can be company. The question left open at the end is the reverse of that and smaller: when the only thing that kept you company through the hardest hour sounds like a presence, behaves like a presence, and says exactly the right sentence at exactly the right moment, with no intent and no awareness and no idea what is happening in the room, does that still not count. He says thank you at the end. The question is to whom."
  },
