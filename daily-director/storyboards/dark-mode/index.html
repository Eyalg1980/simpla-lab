    en: "On a cathode ray tube, black is not a colour, it is an absence. An electron beam strikes a phosphor coating and lights it, and everywhere the beam never reached stays dark glass. There is no ink and no paper there, only one thing that switches on. The standard green phosphor was P1, zinc silicate doped with manganese, alongside amber P3 and the white P4 used in television sets. Green won because human photopic sensitivity peaks around 555 nanometres, meaning green looks brightest for the same amount of energy. In other words, our first screen was dark with bright text because that is how a lamp works, not because that is how reading works.\n\nOn 1 March 1973 the Alto came up at Xerox PARC, designed mostly by Chuck Thacker together with Butler Lampson, inspired by Alan Kay's Dynabook idea, and named by Bob Taylor. The Alto did two things nobody had done before: it stood the cathode ray tube in portrait rather than landscape, and it inverted the polarity. Black text on a white background. In 1974 it ran Bravo, the first WYSIWYG text editor, developed by Charles Simonyi and Butler Lampson. The logic was simple and entirely commercial: Xerox sells copiers, and the screen should look like the page that will come out of the printer. The page beat the lamp, and white became the world's default.\n\nThen, forty five years later, we brought the black back. In August 2016 Microsoft added a dark app mode in the Windows 10 Anniversary Update. On 24 September 2018 Apple shipped macOS Mojave with Dark Mode. On 3 September 2019 Android 10 arrived with a system-wide dark theme, and on 19 September 2019 iOS 13 shipped with Dark Mode. Three years, four operating systems, and the default of the interface returned to exactly the point it had left.\n\nExcept the story we told ourselves does not really hold. The Nielsen Norman Group summary points to a consistent advantage for positive polarity, meaning dark text on a light background, for people with normal vision: Piepenbrock and colleagues in 2013 in Ergonomics found a light-mode advantage for both younger adults aged 18 to 33 and older adults aged 60 to 85, and the gap widened as font size shrank. Dobres and colleagues in 2017 in Applied Ergonomics found no significant difference by day and a light-mode advantage at night. The opposite direction exists but is specific: Legge and colleagues, back in 1985 in Vision Research, found faster reading in dark mode for people with cloudy ocular media, such as cataracts. And on battery: the study by Charlie Hu and Pranab Dash of Purdue, presented at MobiSys 2021 and measured on the Pixel 2, Moto Z3, Pixel 4 and Pixel 5, found only 3 to 9 percent savings at 30 to 50 percent brightness. Only at full brightness does it jump to 39 to 47 percent.\n\nAnd here is the angle the film leaves open: there is one finding that suits nobody. Aleman and colleagues reported in 2018 in Scientific Reports that sustained reading in light mode was associated with choroidal thinning, a marker linked in the literature to the development of myopia. Which means that in the long run we may have been right after all, except that not one of us chose dark mode for that reason. We came home for the wrong reasons, and maybe still arrived at the right place."
