    enCopyLabel: "Copy English direction",
    en: "Tone: calm, curious, and with no longing in it at all. The film is not sad while it runs, it becomes sad only in retrospect, in the last shot. Until then it is essentially a game: what changed on the sill since the last shot. The viewer is never asked to be patient, they are handed a fresh puzzle at every cut, and that is the film's entire defence against boredom.\n\nPacing: the first shots are long and spacious because the viewer is still learning the rules. From the cutting onward the cutting tightens, the storm is the only comma, and from shot 16 everything slows. Shot 20 is the longest in the film and must not be cut into.\n\nCamera: two locked angles only, A on his window and B on hers, and zero camera movement in the entire film. One exception: shot 17 is a macro close-up on hands, the only time the camera comes near anyone. So it comes near at exactly the moment he finally tries to speak.\n\nLight: the light is the film's clock and also its calendar. It opens on hard vertical Israeli summer sun, passes through flat overcast light on the morning after the storm, and closes on low raking end-of-August light. No shot explains the passage of time in words because the light has already done it.\n\nMaterial: faded sand plaster, peeling shutter green, terracotta. Three materials and nothing else. The two sills are the stage, the shaft is the drop between them, and the interiors are never seen.\n\nSound: a courtyard. Pigeons, a dripping air conditioner, dishes from someone else's kitchen, a television from another floor, wind in the shaft. The sound is what makes the silence populated rather than empty.\n\nThe hard rule: the two characters are never in frame together, and neither is ever seen performing an action on the other's sill. Every act they commit happens between cuts. That is both what makes the film technically almost impossible to break and what makes it romantic."
  },

    paras: [
      "תל אביב מוכרת בעולם בזכות הצד היפה של הבנייה שלה. העיר הלבנה, כארבעת אלפים מבנים בסגנון הבינלאומי שנבנו בעיקר משנות השלושים, נרשמה כאתר מורשת עולמית של אונסק\"ו ב-2003. אבל הסרט הזה לא מתרחש בחזית של אף אחד מהמבנים האלה. הוא מתרחש בדבר שאף אחד לא מצלם: הפיר הפנימי בגב הבניין.",
      "החצר הפנימית הצרה היא פתרון הנדסי ולא רעיון קהילתי. כשבונים בצפיפות על מגרש עירוני, החדרים הפנימיים צריכים אוויר ואור, אז חותכים בבניין באר אנכית ומפנים אליה את המטבחים, השירותים וחדרי השירות. התוצאה היא שהחלקים הכי פרטיים של שתי דירות זרות נפתחים אל אותו חלל בגודל של מסדרון. אף אחד לא תכנן שם קרבה. הקרבה היא תופעת לוואי של מערכת אוורור.",
      "ולכן זה עובד. אתה מכיר את הריחות של השכן שלך, את שעת המקלחת שלו ואת התוכנית שהוא רואה, ובאותו זמן אתה לא בטוח באיזו קומה הוא גר. הפיר מספק אינטימיות מלאה בלי היכרות, וזה בדיוק המצב שהסרט מנצל: שני אנשים שיודעים הכל אחד על השני חוץ מהדבר האחד שהיה משנה.",

    enLabel: "English backstory",
    enCopyLabel: "Copy English backstory",
    en: "Tel Aviv is known abroad for the beautiful side of its building stock. The White City, roughly four thousand International Style buildings put up mostly from the 1930s, was inscribed as a UNESCO World Heritage site in 2003. But this film does not take place on the facade of any of those buildings. It takes place in the thing nobody photographs: the inner shaft at the back.\n\nThe narrow inner courtyard is an engineering solution, not a community idea. When you build densely on an urban plot, the inner rooms still need air and light, so you cut a vertical well through the building and turn the kitchens, the bathrooms and the service rooms toward it. The result is that the most private parts of two unrelated apartments open onto the same space, a space about the width of a corridor. Nobody designed closeness in there. The closeness is a side effect of a ventilation system.\n\nAnd that is why it works. You know your neighbour's cooking smells, their shower hour and the show they watch, and at the same time you are not sure which floor they live on. The shaft supplies complete intimacy without acquaintance, and that is exactly the condition the film exploits: two people who know everything about each other except the one thing that would have mattered.\n\nThe windowsill is the only surface in a home that is visible from both sides. It is neither public nor private, it is an eye-level shelf where you choose what to put out, and whoever is opposite you sees it. In that sense it is an interface in the full meaning of the word: a small display area, a limited inventory of objects, and every choice is a message. The question the film leaves open, and I am not sure it has an answer: if you can hold a whole conversation without language, why do you still wait for the note. And if you are going to wait anyway, why wait that long."
  },
