    en: "Quiet, restrained, a little sad and with no sentimentality at all. This is not a film about technology, it is a film about something that does a whole job while nobody looks at it. The feeling that should remain at the end is not pity but respect.\n- Pacing: very long breaths in act one, eight to ten second shots with no events. Act two accelerates slightly, not through cutting but through how much happens inside the frame. Act three returns to exactly the pacing of the opening, and that is what closes the loop.\n- Camera: one move per shot, never two. Slow push ins, slow pull backs, and three depth moves in the whole film (shots 11, 17 and 23) which all go to Veo 3. There is no fast cut anywhere.\n- Material: lines only. Nothing in this film ever gets a fill, a texture or a surface. A face is contour lines, rain is vertical lines, a crowd is hollow contours. This is the one rule that must not break in a single shot.\n- Light: one soft source from the upper left, identical throughout. The light never moves and never changes. The only thing that changes is the temperature of the lines themselves, from cold grey to coral and amber and back.\n- Sound: one low electrical buzz through all of act one. In shot 9 a single warm tone enters and grows through the dream. In act three everything is pulled back into the original buzz. Two effects in total: a dry click on the delete in shot 3, and one breath when the dream opens in shot 10.\nRules: lines only, no fills | one camera move per shot | colour is a variable, not a second style | no text inside the generation"

    en: "The first interface in the world was a wireframe, and not because anyone chose it. In January 1963 Ivan Sutherland submitted his MIT thesis, Sketchpad: A Man-Machine Graphical Communication System. It ran on the Lincoln Laboratory TX-2, drawn with a light pen on a cathode ray tube, and it introduced geometric constraints, so that the length of a line or the angle between two lines could be fixed. Everything in it is lines with no fill. There was no colour to choose.\n\nThe word itself arrived much later and from another world. Wireframe is a term from three dimensional graphics, a model that shows shape without shading or texture. The person who claims to have brought it into web design is Matthew Van Horn, who said he started using it around 1994 at Snickelways Interactive, describing to colleagues how you separate the structure of a page from its visual design. He himself says he has no documentary proof and that several people may have started using it at once. Note the irony: the word for a thing with no colour has no clear origin either.\n\nIn April 1994, at roughly the same time, Marc Rettig published Prototyping for Tiny Fingers in Communications of the ACM. His argument is that a rough paper prototype works precisely because it is rough, since it maximises the number of refinement cycles you get before you must commit to code. On 30 March 2000 Jesse James Garrett published The Elements of User Experience diagram, which became a book in 2002, and in it the skeleton plane sits below the surface plane. Both works say the same thing from two directions: the real decisions fall lower down, and the colour arrives later only to agree.\n\nMy angle is that we all treat the wireframe as a stage you pass through, a waiting room before the real thing. But every decision that determines how a human being will live with this product falls right there, while it is grey and everyone agrees it is temporary. The question the film leaves open is not what the future lo
