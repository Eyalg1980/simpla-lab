<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מיישמי AI 2027</title>
<meta name="description" content="גרסת העתיד של אתר קורס 53500, מיישמי AI ואוטומציה בג׳ון ברייס: מה עושים היום, מפגש אחרי מפגש.">
<meta name="theme-color" content="#2C3AE0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== tokens. Version 2027.1. Cobalt is the line and every action, magenta is "now" and "needs you" only. ===== */
:root{
  --bg:#EEF0F4; --sf:#FFFFFF; --sf2:#F5F6F9; --ink:#1B2030; --ink2:#454E63; --ink3:#5C6579; --line:#D6DBE5; --line2:#C3CAD8;
  --co:#2C3AE0; --co-ink:#FFFFFF; --co-soft:#E4E7FF; --co-deep:#1D27A8;
  --mg:#C8106F; --mg-ink:#FFFFFF; --mg-soft:#FCE4F0;
  --ok:#17784F; --ok-soft:#DDF2E8;
  --r1:10px; --r2:16px; --r3:22px;
  --sh:0 1px 0 rgba(27,32,48,.04), 0 6px 18px -10px rgba(27,32,48,.18);
  --font:'IBM Plex Sans Hebrew', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --top:56px; --bot:68px; --rail:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1220; --sf:#161B2D; --sf2:#1C2237; --ink:#E9ECF4; --ink2:#C0C6D6; --ink3:#A1A9BD; --line:#2A3249; --line2:#39425C;
    --co:#8A93FF; --co-ink:#0E1220; --co-soft:#232A52; --co-deep:#B9BEFF;
    --mg:#FF5CAB; --mg-ink:#1A0611; --mg-soft:#3B1730; --ok:#5ED3A0; --ok-soft:#163327;
    --sh:0 1px 0 rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1220; --sf:#161B2D; --sf2:#1C2237; --ink:#E9ECF4; --ink2:#C0C6D6; --ink3:#A1A9BD; --line:#2A3249; --line2:#39425C;
  --co:#8A93FF; --co-ink:#0E1220; --co-soft:#232A52; --co-deep:#B9BEFF;
  --mg:#FF5CAB; --mg-ink:#1A0611; --mg-soft:#3B1730; --ok:#5ED3A0; --ok-soft:#163327;
  --sh:0 1px 0 rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px;scroll-padding-bottom:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font);font-variant-numeric:tabular-nums;
  padding-top:var(--top);padding-bottom:calc(var(--bot) + env(safe-area-inset-bottom));overflow-x:hidden;overflow-x:clip}
a{color:var(--co);text-underline-offset:3px}
a:hover{color:var(--co-deep)}
img{max-width:100%;height:auto}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--co);outline-offset:2px;border-radius:6px}
::selection{background:var(--co-soft)}
.en,[lang="en"]{unicode-bidi:isolate}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;top:8px;right:8px;z-index:100;background:var(--co);color:var(--co-ink);padding:10px 16px;border-radius:var(--r1);transform:translateY(-200%)}
.skip:focus{transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== chrome ===== */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:30;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wm{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-height:44px;margin-inline-end:auto}
.wm-mark{width:30px;height:30px;flex:none}
.wm-t{font-weight:700;font-size:16px;line-height:1.1}
.wm-t small{display:block;font-weight:500;font-size:12px;color:var(--ink3)}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--sf2)}
.ib svg{width:22px;height:22px}
.ib[hidden]{display:none}
.edchip{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line2);background:var(--sf);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.edchip:hover{border-color:var(--co)}
.edchip i{width:8px;height:8px;border-radius:50%;background:var(--co);display:block}
.edchip[data-ed="eve"] i{background:var(--ink);box-shadow:inset -3px 0 0 var(--co)}
.nav{position:fixed;z-index:30;inset:auto 0 0 0;height:calc(var(--bot) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:var(--sf);border-top:1px solid var(--line)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--ink3);font-size:12px;font-weight:600;min-height:44px;position:relative}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--co)}
.nav a[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;border-radius:0 0 3px 3px;background:var(--co)}
.nav .nv-side{display:none}
main{display:block;max-width:1120px;margin:0 auto;padding:16px 16px 40px}
main:focus{outline:none}

/* ===== type ===== */
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700;letter-spacing:-.005em}
h1{font-size:28px}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0 0 12px}
.sub{color:var(--ink2);font-size:15px}
.muted{color:var(--ink3)}
.lede{font-size:17px;color:var(--ink2);max-width:62ch}
.sec{margin-top:28px}
.sec > h2{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.prose{max-width:72ch}
.prose ul,.prose ol{padding-inline-start:20px;margin:0 0 12px}
.prose li{margin-bottom:6px}

/* ===== atoms ===== */
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r2);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:0;cursor:pointer;
  background:var(--co);color:var(--co-ink);font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{background:var(--co-deep);color:var(--co-ink)}
.btn.ghost{background:transparent;color:var(--co);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--co);color:var(--co)}
.btn svg{width:18px;height:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ct{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--sf2);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2);line-height:1}
.ct.act{background:var(--mg);color:var(--mg-ink);box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--sf2);color:var(--ink2);font-size:13px;font-weight:500;border:1px solid var(--line)}
.tag.now{background:var(--mg-soft);color:var(--mg);border-color:transparent;font-weight:600}
.tag.core{background:var(--co-soft);color:var(--co-deep);border-color:transparent;font-weight:600}
.tag.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.est{border-style:dashed}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--sf);
  cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--co);border-color:var(--co);color:var(--co-ink)}
.chip[aria-pressed="true"] .ct{background:rgba(255,255,255,.22);color:inherit;box-shadow:none}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--sf2);border:1px solid var(--line);gap:4px}
.seg button,.seg a{min-height:40px;padding:0 16px;border-radius:10px;border:0;background:none;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:4px}
.back svg{width:18px;height:18px;transform:scaleX(-1)}
.empty{padding:24px;border:1.5px dashed var(--line2);border-radius:var(--r2);color:var(--ink2);text-align:center}
.toast{position:fixed;z-index:60;inset-inline:16px;bottom:calc(var(--bot) + 16px + env(safe-area-inset-bottom));margin:0 auto;max-width:360px;background:var(--ink);color:var(--bg);
  padding:12px 16px;border-radius:12px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* ===== the line: the course as one transit line ===== */
.line-w{margin:4px -16px 0;padding:8px 16px 4px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.line-w::-webkit-scrollbar{display:none}
.line{display:flex;align-items:flex-start;gap:0;min-width:max-content;padding:34px 8px 6px}
.lmod{position:relative;display:flex;flex-direction:column;padding-inline-end:18px}
.lmod:last-child{padding-inline-end:0}
.lstops{display:flex;position:relative}
.lstops::before{content:"";position:absolute;top:21px;inset-inline:16px;height:6px;border-radius:6px;background:var(--line2)}
.lmod:not(:last-child) .lstops::after{content:"";position:absolute;top:21px;inset-inline-start:calc(100% - 16px);width:calc(18px + 32px);height:6px;background:var(--line2)}
.lmod.past .lstops::before,.lmod.past:not(:last-child) .lstops::after{background:var(--co)}
.lmod.cur .lstops::before{background:linear-gradient(to left,var(--co) var(--fill,0%),var(--line2) var(--fill,0%))}
.stop{position:relative;z-index:1;width:44px;height:48px;display:grid;place-items:center;text-decoration:none;color:var(--ink);scroll-snap-align:center}
.stop i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sf);border:3px solid var(--line2);font:600 11px/1 var(--font);font-style:normal;color:var(--ink3)}
.stop.past i{background:var(--co);border-color:var(--co);color:var(--co-ink)}
.stop.next i{width:36px;height:36px;background:var(--mg);border-color:var(--mg);color:var(--mg-ink);font-size:13px;box-shadow:0 0 0 6px var(--mg-soft)}
.stop.next::after{content:attr(data-here);position:absolute;bottom:calc(100% + 2px);white-space:nowrap;font:600 12px/1 var(--font);color:var(--mg);background:var(--mg-soft);padding:5px 8px;border-radius:8px}
.stop:hover i{border-color:var(--co)}
button.stop{border:0;background:none;padding:0;font:inherit;cursor:pointer}
.stop.sel i{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--co)}
.stop.sel.next i{box-shadow:0 0 0 6px var(--mg-soft)}
.line-sticky{position:sticky;top:var(--top);z-index:20;background:var(--bg);margin:0 -16px;padding:0 16px;border-bottom:1px solid var(--line)}
.line-sticky .line-w{margin-top:0}
.line-sticky .line{padding-top:30px}
.line-sticky .line-k{margin:2px 0 10px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.lname{font-size:12px;font-weight:600;color:var(--ink3);padding:4px 16px 0;white-space:nowrap;max-width:100%}
.lmod.cur .lname{color:var(--ink)}
.line-k{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink3);margin-top:6px}
.line-k span{display:inline-flex;align-items:center;gap:6px}
.line-k b{width:12px;height:12px;border-radius:50%;display:inline-block;border:3px solid var(--line2);background:var(--sf)}
.line-k b.p{background:var(--co);border-color:var(--co)}
.line-k b.n{background:var(--mg);border-color:var(--mg)}

/* ===== today ===== */
.hello{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.hello h1{font-size:30px}
.upnext{margin-top:18px;display:grid;gap:18px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r3);padding:20px;position:relative;overflow:hidden}
.upnext::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--co)}
.up-num{display:flex;align-items:baseline;gap:12px}
.up-num b{font-size:64px;line-height:.9;font-weight:700;color:var(--co);letter-spacing:-.03em}
.up-num > span{font-weight:600;color:var(--ink2)}
.upnext h2{font-size:24px}
.out{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.out li{display:flex;gap:10px;align-items:flex-start}
.out li svg{flex:none;width:20px;height:20px;color:var(--co);margin-top:3px}
.grid2{display:grid;gap:14px;margin-top:14px}
.mini h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mini h3 svg{width:20px;height:20px;color:var(--co)}
.mini.need{border-color:var(--mg)}
.mini.need h3 svg{color:var(--mg)}
.grid2 > *{min-width:0}
.pick{display:grid;gap:6px;margin-top:6px;font-weight:600;font-size:14px;color:var(--ink2)}
.pick select{min-height:44px;width:100%;min-width:0;max-width:560px;border-radius:12px;border:1.5px solid var(--line2);background:var(--sf);color:var(--ink);padding:0 12px;font:600 14px var(--font);cursor:pointer}
.pick select:focus{border-color:var(--co);outline:none;box-shadow:0 0 0 3px var(--co-soft)}
.cday{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;text-decoration:none;color:inherit}
.cday img{width:72px;height:72px;object-fit:cover;border-radius:14px;background:var(--sf2)}

/* ===== meetings list ===== */
.mods{display:grid;gap:22px;margin-top:16px}
.mod-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.mod-h h2{font-size:19px}
.mlist{list-style:none;margin:0;padding:0;background:var(--sf);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.mlist li + li{border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:inherit;min-height:64px}
.mrow:hover{background:var(--sf2)}
.mrow .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:3px solid var(--line2);color:var(--ink2);background:var(--sf)}
.mrow.past .dot{background:var(--co);border-color:var(--co);color:var(--co-ink)}
.mrow.next .dot{background:var(--mg);border-color:var(--mg);color:var(--mg-ink)}
.mrow b{display:block;font-weight:600}
.mrow small{color:var(--ink3);font-size:13px}

/* ===== meeting hub ===== */
.mh{display:grid;gap:10px;margin-top:4px}
.mh-n{font-size:15px;font-weight:600;color:var(--ink2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mh h1{font-size:30px;max-width:24ch}
.mh .seg{margin-top:8px;justify-self:start}
.hub{display:grid;gap:4px}
.part{margin-top:22px}
.part > h3{font-size:15px;color:var(--ink3);font-weight:600;margin-bottom:6px}
.topics{counter-reset:t;list-style:none;margin:0;padding:0;display:grid;gap:2px}
.topics li{counter-increment:t;display:grid;grid-template-columns:28px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.topics li::before{content:counter(t);font-weight:700;color:var(--co)}
.demo{background:var(--co-soft);border-radius:var(--r2);padding:14px 16px;color:var(--ink)}
.demo b{display:block;margin-bottom:2px}
.decks{display:grid;gap:10px}
.dk{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--sf);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;min-height:64px}
.dk:hover{border-color:var(--co)}
.dk-t{font-weight:700;color:var(--co);font-size:14px;text-align:center;line-height:1.1}
.dk-t small{display:block;font-weight:500;color:var(--ink3);font-size:11px;margin-top:3px}
.dk b{display:block;font-weight:600;line-height:1.35}
.dk b + span{display:block;font-size:13px;color:var(--ink3)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cg{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--sf);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;min-height:44px}
.cg:hover{border-color:var(--co)}
.cg img{aspect-ratio:3/2;object-fit:cover;width:100%;background:var(--sf2);display:block}
.cg div{padding:10px 12px}
.cg b{display:block;font-weight:600;line-height:1.3}
.cg b + span{display:block;font-size:12px;color:var(--ink3)}
.cg .core{display:block;margin-top:6px;font-size:11px;font-weight:600;color:var(--co)}
.pnav{display:flex;justify-content:space-between;gap:10px;margin-top:32px;border-top:1px solid var(--line);padding-top:16px}
.pnav a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);min-height:44px;max-width:48%}
.pnav a small{color:var(--ink3);font-weight:600}
.pnav a:last-child{text-align:left;margin-inline-start:auto}

/* ===== prompts ===== */
.pr{background:var(--sf);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.pr + .pr{margin-top:10px}
.pr-h{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.pr-h b{flex:1 1 220px;font-weight:600;line-height:1.35}
.pr pre{margin:0;padding:14px 16px;background:var(--sf2);border-top:1px solid var(--line);font:400 15px/1.75 var(--font);white-space:pre-wrap;word-break:break-word;unicode-bidi:plaintext;display:none}
.pr.open pre{display:block}
.pr-t svg{width:18px;height:18px;transition:transform .2s}
.pr.open .pr-t svg{transform:rotate(180deg)}
.pr-a{display:flex;gap:6px;margin-inline-start:auto}
.pr-a button{min-height:40px}

/* ===== lecturer ===== */
.lect-note{background:var(--sf);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;margin-top:12px}
.lect-note.st{border-color:var(--ok);background:var(--ok-soft)}
.blocks{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.blk{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.blk-t{font-weight:700;font-size:15px;line-height:1.2}
.blk-t small{display:block;color:var(--ink3);font-weight:500;font-size:12px;margin-top:4px}
.blk-w{font-weight:600}
.blk-h{color:var(--ink2);font-size:14.5px;margin-top:4px;grid-column:2}
.blk .bdk a svg{width:16px;height:16px;flex:none;margin-inline-end:6px}
.blk-s{font-size:12px;color:var(--ink3);margin-top:6px}
.blk.brk{background:var(--sf2);border-style:dashed}
.blk.ws{border-color:var(--co);background:var(--co-soft)}
.blocks#liveList .blk{cursor:pointer}
.blocks#liveList .blk:hover{border-color:var(--co)}
.blk.now{border-color:var(--mg);box-shadow:0 0 0 3px var(--mg-soft)}
.blk .bdk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.blk .bdk a{font-size:13px;min-height:32px;display:inline-flex;align-items:center;padding:0 10px;border-radius:8px;background:var(--co-soft);color:var(--co-deep);text-decoration:none;font-weight:600}
.rich{max-width:80ch}
.rich h3,.rich h4{margin:18px 0 8px}
.rich .callout{background:var(--sf);border:1px solid var(--line);border-inline-start:4px solid var(--co);border-radius:var(--r1);padding:12px 14px;margin:12px 0}
.rich table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px;background:var(--sf)}

details.fold > summary svg{width:20px;height:20px;margin-inline-start:auto;transition:transform .2s;color:var(--ink3);flex:none}

  .cpage{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
  .cpage figure{order:2;position:sticky;top:calc(var(--top) + 16px)}
  .live{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
  .live-now{position:sticky;top:calc(var(--top) + 16px)}
  .subs{grid-template-columns:repeat(3,1fr)}
  .tlist{grid-template-columns:1fr 1fr}

}

const put=(k,v)=>{ try{ v==null?localStorage.removeItem('jb27.'+k):localStorage.setItem('jb27.'+k,v); }catch(e){} };

const qs=new URLSearchParams(location.search);
let ED=(qs.get('ed')==='eve'||qs.get('ed')==='morn')?qs.get('ed'):(get('ed')||'morn');

const TODAY=(()=>{ const t=qs.get('today'); const d=t?new Date(t+'T12:00:00'):new Date(); d.setHours(12,0,0,0); return d; })();
/* same access as the current site: marketing sees no lecturer material, the lecturer sees no marketing page */
const isStaff=()=>ROLE==='lecturer'||ROLE==='admin'||ROLE==='owner';
const canMkt=()=>ROLE==='marketing'||ROLE==='admin'||ROLE==='owner';
const needsDS=()=>isStaff()||canMkt();

/* ---------- model ---------- */
const MODS=D.ED.morn.mods.map(m=>({n:m.n,t:m.t,intro:m.intro,tools:m.tools,h:m.h,M:m.M.map(x=>+x.n)}));
const MEET={};
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
D.ED.morn.mods.forEach(m=>m.M.forEach(x=>{ x.parts.forEach(p=>['rl','top','tools','note','open'].forEach(k=>p[k]=arr(p[k]))); MEET[+x.n]={n:+x.n,mod:m.n,parts:x.parts,title:x.parts.map(p=>p.t).join(', ו'),date:D.DATES[x.n]?new Date(D.DATES[x.n]+'T12:00:00'):null}; }));

const manual=()=>ED==='eve'?!!PICK.eve:!!PICK.morn;
function pickerHTML(id){

const isToday=n=>{ const d=MEET[n]&&MEET[n].date; return d&&d.toDateString()===TODAY.toDateString(); };
/* 16.10: no done/next marking. The date estimate is not reliable enough to show (Eyal) */

function lineHTML(mode){

  return '<div class="line-w" id="lineW"><div class="line" role="list" aria-label="מסלול הקורס">'+MODS.map(m=>{
    const stops=eve?EVES.filter(x=>x.mod===m.n):m.M.map(n=>MEET[n]);
    const st=stops.map(x=>eve?eStatus(x.e):status(x.n));
    const cls=st.every(s=>s==='past')?'past':(st.indexOf('next')>-1?'cur':'');
    const fill=cls==='cur'?Math.round(st.indexOf('next')/Math.max(1,stops.length-1)*100):0;
    return '<div class="lmod '+cls+'" style="--fill:'+fill+'%" role="listitem"><div class="lstops">'+stops.map((x,i)=>{
      const num=eve?x.e:x.n, href=eve?'#/e/'+x.e:'#/m/'+x.n;
      const lab=(eve?'ערב ':'מפגש ')+num+', '+strip(x.title)+(st[i]==='past'?', בוצע':(st[i]==='next'?', הבא':''));
      const here=st[i]==='next'?' data-here="'+(manual()?'עכשיו':(isToday(x.n)&&!eve?'היום':'הבא'))+'" aria-current="step"':'';
      if(mode==='select'){ const on=num===(VSEL||curK); return '<button type="button" class="stop '+st[i]+(on?' sel':'')+'" data-sel="'+num+'" aria-pressed="'+on+'" aria-label="'+esc(lab)+', להצגה למטה"'+here+'><i>'+num+'</i></button>'; }
      return '<a class="stop '+st[i]+'" href="'+href+'" aria-label="'+esc(lab)+'"'+here+'><i>'+num+'</i></a>';

  }).join('')+'</div></div>';
}

  let h='<a class="back" href="#/m">'+ic('arrow')+'כל הערבים</a><header class="mh"><div class="mh-n"><span>ערב '+e+'</span>'+(E.K>1?'<span class="tag">חלק '+E.k+' מתוך '+E.K+'</span>':'')+
    (eStatus(e)==='past'?'<span class="tag done">בוצע בבוקר</span>':(eStatus(e)==='next'?'<span class="tag now">הנקודה המקבילה</span>':''))+'</div><h1>'+esc(E.title)+'</h1><p class="muted" style="margin:0">'+esc(modName(E.mod))+'. מקביל למפגש '+E.n+' בבוקר. 17:00 עד 21:45.</p>';
  if(isStaff()) h+='<div class="seg" role="group" aria-label="תצוגה"><a href="#/e/'+e+'"'+(tab!=='lect'?' aria-current="page"':'')+'>לתלמידים</a><a href="#/e/'+e+'/lect"'+(tab==='lect'?' aria-current="page"':'')+'>'+ic('board')+'למרצה</a></div>';
  h+='</header>';
  if(tab==='lect'&&isStaff()) h+='<div id="lectBody">'+(window.DS?boardHTML(DS.boards.find(b=>b.kind==='eve'&&b.n===e)):'<p class="empty">טוען את חומרי המרצה</p>')+'</div>';
  else h+=(E.K>1?'<p class="lect-note">המפגש של הבוקר מתפרס על '+E.K+' ערבים. התוכן כאן הוא של המפגש כולו, והמרצה מחלק אותו בין הערבים.</p>':'')+studentHub(E.n);

}
function pnav(ha,la,hb,lb){ return '<nav class="pnav" aria-label="מעבר בין '+U().many+'">'+(ha?'<a href="'+ha+'"><small>הקודם</small>'+esc(la)+'</a>':'<span></span>')+(hb?'<a href="'+hb+'"><small>הבא</small>'+esc(lb)+'</a>':'')+'</nav>'; }

/* live board: one block at a time, follows the clock on the day itself */
let LIVE={key:'',i:0,clock:false,timer:null};
function vLive(kind,n){
  if(!isStaff()) return vMissing();
  if(!window.DS) return '<p class="empty">טוען את חומרי המרצה</p>';
  const b=DS.boards.find(x=>x.kind===kind&&x.n===n); if(!b) return vMissing();
  const key=kind+n;
  if(LIVE.key!==key){ LIVE={key,i:0,clock:false,timer:LIVE.timer}; }
  return '<a class="back" href="#/'+(kind==='eve'?'e':'m')+'/'+n+'/lect">'+ic('arrow')+(kind==='eve'?'ערב ':'מפגש ')+n+', לוח מלא</a>'+
    '<h1 style="font-size:22px;margin-bottom:12px">'+esc(b.title)+'</h1><div class="live"><section class="live-now" id="liveNow" aria-live="polite"></section><ol class="blocks" id="liveList" aria-label="כל הבלוקים, לחיצה עוברת לבלוק">'+b.rows.map((r,i)=>blockHTML(b,r,i)).join('')+'</ol></div>';
}
function liveTick(){
  const m=location.hash.match(/^#\/live\/(m|e)\/(\d+)/); if(!m||!window.DS){ clearInterval(LIVE.timer); LIVE.timer=null; return; }
  const kind=m[1]==='e'?'eve':'morn', b=DS.boards.find(x=>x.kind===kind&&x.n===+m[2]); if(!b) return;
  const now=new Date(), nm=now.getHours()*60+now.getMinutes();
  if(LIVE.clock){ let k=b.rows.findIndex(r=>{ const a=tmin(r.t); return nm>=a&&nm<a+r.d; }); if(k<0) k=nm<tmin(b.rows[0].t)?0:b.rows.length-1; LIVE.i=k; }
  const r=b.rows[LIVE.i], a=tmin(r.t), nx=b.rows[LIVE.i+1];
  const left=LIVE.clock?Math.max(0,a+r.d-nm):r.d, pct=LIVE.clock?Math.min(100,Math.max(0,(nm-a)/r.d*100)):0;
  const cs=r.kind?[]:cardsIn(b,r,LIVE.i);
  const el=$('#liveNow'); if(!el) return;
  el.innerHTML='<div class="live-clock"><b>'+esc(r.t)+'</b><span>'+r.d+' דקות'+(LIVE.clock?', נשארו '+left:'')+'</span><span class="tag'+(LIVE.clock?' now':'')+'" style="margin-inline-start:auto">'+(LIVE.clock?'לפי השעון':'ידני')+'</span></div>'+
   (LIVE.clock?'<div class="live-bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>':'')+
   '<h2 class="rich">'+r.what+'</h2>'+(r.how?'<div class="rich" style="color:var(--ink2)">'+r.how+'</div>':'')+
   (cs.length?'<div class="decks" style="margin-top:14px">'+cs.filter(c=>D.DECKS[c.deck]).map(c=>deckCard(c.deck)).join('')+'</div>':'')+
   '<div class="live-ctl"><button class="btn ghost" type="button" data-live="-1"'+(LIVE.i===0?' disabled':'')+'>הבלוק הקודם</button><button class="btn" type="button" data-live="1"'+(LIVE.i>=b.rows.length-1?' disabled':'')+'>הבלוק הבא</button>'+
   '<button class="btn ghost" type="button" data-live="clock" aria-pressed="'+LIVE.clock+'">'+ic('today')+(LIVE.clock?'מעבר לידני':'לפי השעון')+'</button></div>'+
   (nx?'<p class="live-nxt">אחר כך, '+esc(nx.t)+': '+esc(strip(nx.what))+'</p>':'');
  $$('#liveList .blk').forEach((x,i)=>{ x.classList.toggle('now',i===LIVE.i); x.tabIndex=0; x.setAttribute('role','button'); x.dataset.jump=i; x.setAttribute('aria-current',i===LIVE.i?'step':'false'); });
}

/* ---------- bidi: every Latin run inside Hebrew text gets its own direction, so "ו-Git" and "MCP," stay in order ---------- */
const LAT=/[A-Za-z][A-Za-z0-9.+#_\/-]*(?:[ ][A-Za-z0-9][A-Za-z0-9.+#_\/-]*)*/g;
function bidi(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(!/[A-Za-z]/.test(n.nodeValue)||!/[\u0590-\u05FF]/.test(n.parentNode.textContent)) return NodeFilter.FILTER_REJECT;
    return n.parentNode.closest('pre,code,svg,script,style,[dir="ltr"],[lang="en"],bdi,input,textarea')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }});
  const list=[]; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(n=>{ const t=n.nodeValue; LAT.lastIndex=0; if(!LAT.test(t)) return; LAT.lastIndex=0;
    const f=document.createDocumentFragment(); let last=0, m;
    while((m=LAT.exec(t))){ let run=m[0].replace(/[.\/-]+$/,''); if(!run) continue;
      if(m.index>last) f.appendChild(document.createTextNode(t.slice(last,m.index)));
      const sp=document.createElement('span'); sp.dir='ltr'; sp.lang='en'; sp.textContent=run; f.appendChild(sp); last=m.index+run.length; }
    if(last<t.length) f.appendChild(document.createTextNode(t.slice(last)));
    /* inside a flex or grid box each piece would become its own item, so keep them in one span */
    const d=getComputedStyle(n.parentNode).display;
    if(/flex|grid/.test(d)){ const w2=document.createElement('span'); w2.appendChild(f); n.parentNode.replaceChild(w2,n); } else n.parentNode.replaceChild(f,n); });
}

    for(let j=16;j<64;j++){ const s0=R(w[j-15],7)^R(w[j-15],18)^(w[j-15]>>>3), s1=R(w[j-2],17)^R(w[j-2],19)^(w[j-2]>>>10); w[j]=(w[j-16]+s0+w[j-7]+s1)|0; }
    let [a,c,d,e,f,g,h,l]=H;
    for(let j=0;j<64;j++){ const S1=R(f,6)^R(f,11)^R(f,25), ch=(f&g)^(~f&h), t1=(l+S1+ch+K[j]+w[j])|0, S0=R(a,2)^R(a,13)^R(a,22), mj=(a&c)^(a&d)^(c&d), t2=(S0+mj)|0; l=h;h=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0; }
    H=[H[0]+a|0,H[1]+c|0,H[2]+d|0,H[3]+e|0,H[4]+f|0,H[5]+g|0,H[6]+h|0,H[7]+l|0]; }
  return H.map(x=>((x>>>0).toString(16).padStart(8,'0'))).join('');
}

/* ---------- events ---------- */
/* a prompt is either closed (title only) or fully open, never cut half way */
function setPr(c,o){ if(!c) return; c.classList.toggle('open',o); const b=c.querySelector('[data-more]'); if(b){ b.setAttribute('aria-expanded',o); b.querySelector('span').textContent=o?'סגירה':'פתיחה'; } }
function copyText(t){
  const done=()=>toast('הפרומפט הועתק');
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done)); else fallbackCopy(t,done);
}
function fallbackCopy(t,done){ const a=document.createElement('textarea'); a.value=t; a.setAttribute('readonly',''); a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('ההעתקה לא עבדה. סמנו את הטקסט והעתיקו ידנית.'); } a.remove(); }
function jumpBlock(el){ if(!el||el.dataset.jump==null) return; LIVE.clock=false; LIVE.i=+el.dataset.jump; liveTick(); const n=$('#liveNow'); if(n&&window.innerWidth<1024) n.scrollIntoView({block:'start',behavior:'smooth'}); }
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.jump!=null){ e.preventDefault(); jumpBlock(e.target); } });
document.addEventListener('click',e=>{
  const j=e.target.closest('#liveList .blk'); if(j&&!e.target.closest('a')){ jumpBlock(j); return; }
  const t=e.target.closest('button,[data-ed]'); if(!t) return;
  if(t.dataset.sel!=null){ showSel(+t.dataset.sel); return; }
  if(t.dataset.vsel!=null){ showSel(0); const w=$('#lineW'), c=w&&w.querySelector('.stop.sel'); if(c) c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); return; }
  if(t.dataset.copy!=null){ copyText(D.prompts[+t.dataset.copy].text); return; }
  if(t.dataset.more!=null){ setPr(t.closest('.pr'),!t.closest('.pr').classList.contains('open')); return; }
  if(t.dataset.pf!=null){ TSTATE.f=t.dataset.pf==='all'?'all':+t.dataset.pf; route(); return; }
  if(t.dataset.core!=null){ TSTATE.core=t.dataset.core==='1'; route(); return; }
  if(t.dataset.cat!=null){ TSTATE.cat=t.dataset.cat; route(); return; }
  if(t.dataset.tc!=null){ TSTATE.tc=t.dataset.tc; route(); return; }
  if(t.dataset.ed&&t.tagName==='BUTTON'&&t.closest('.seg')){ setEd(t.dataset.ed); return; }
  if(t.dataset.theme){ THEME=t.dataset.theme; put('theme',THEME); applyTheme(); route(); return; }
  if(t.dataset.out){ ROLE=null; put('role',null); location.hash='#/'; route(); return; }
  if(t.dataset.dk){ const n=DK.i+ +t.dataset.dk; location.replace('#/d/'+DK.id+'/'+(n+1)); return; }
  if(t.dataset.dkgo!=null){ location.replace('#/d/'+DK.id+'/'+(+t.dataset.dkgo+1)); return; }
  if(t.dataset.live){ const m=location.hash.match(/^#\/live\/(m|e)\/(\d+)/); const b=DS.boards.find(x=>x.kind===(m[1]==='e'?'eve':'morn')&&x.n===+m[2]);
    if(t.dataset.live==='clock'){ LIVE.clock=!LIVE.clock; } else { LIVE.clock=false; LIVE.i=Math.min(Math.max(0,LIVE.i+ +t.dataset.live),b.rows.length-1); }
    liveTick(); const cur=$('#blk-'+LIVE.i); if(cur&&window.innerWidth>=1024) cur.scrollIntoView({block:'nearest'}); return; }
});
$('#edBtn').addEventListener('click',()=>setEd(ED==='eve'?'morn':'eve'));

  const v=+t.value||0; PICK[ED]=v; VSEL=0; put('cur.'+ED,v||null); recalc(); IDX=null; const id=t.id; route();

  if(e.key==='ArrowDown'){ e.preventDefault(); selMove(1); } else if(e.key==='ArrowUp'){ e.preventDefault(); selMove(-1); }

document.addEventListener('keydown',e=>{
  if(!ROLE) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
  if(e.key==='Escape'&&$('#srch').classList.contains('on')){ closeSearch(); return; }
  if($('#srch').classList.contains('on')||/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='/'){ e.preventDefault(); openSearch(); return; }
  if(/^#\/d\//.test(location.hash)){ const d=D.DECKS[DK.id]; if(!d) return;
    /* in RTL the next slide sits to the left */
    if(e.key==='ArrowLeft'&&DK.i<d.slides.length-1) location.replace('#/d/'+DK.id+'/'+(DK.i+2));
    if(e.key==='ArrowRight'&&DK.i>0) location.replace('#/d/'+DK.id+'/'+DK.i); }
});
let tx=null; document.addEventListener('touchstart',e=>{ if(/^#\/d\//.test(location.hash)) tx=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; const d=D.DECKS[DK.id]; if(!d||Math.abs(dx)<60) return;
  if(dx>0&&DK.i<d.slides.length-1) location.replace('#/d/'+DK.id+'/'+(DK.i+2)); if(dx<0&&DK.i>0) location.replace('#/d/'+DK.id+'/'+DK.i); },{passive:true});
